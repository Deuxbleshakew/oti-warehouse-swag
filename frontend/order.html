<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oti-Warehouse Swag — Project & Delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#E8E5DC;
    --paper:#1E2124;
    --surface:#282C30;
    --surface2:#31363B;
    --bar:#141618;
    --safety:#F2B705;
    --safety-ink:#3A2E00;
    --rust:#E06248;
    --ok:#6FBF8A;
    --line:#3D4349;
    --muted:#9A958A;
    --radius:3px;
  }
  html[data-theme="light"]{
    --ink:#202326;--paper:#F4F2EC;--surface:#FFFFFF;--surface2:#EAE7DF;
    --bar:#25292D;--safety:#D89E00;--safety-ink:#261D00;--rust:#B84431;
    --ok:#237A47;--line:#CBC6BA;--muted:#66645E;
  }
  html[data-theme="high-contrast"]{
    --ink:#FFFFFF;--paper:#000000;--surface:#080808;--surface2:#151515;
    --bar:#000000;--safety:#FFD400;--safety-ink:#000000;--rust:#FF5A44;
    --ok:#64FF91;--line:#FFFFFF;--muted:#E2E2E2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .label{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.08em;
  }
  code, .mono{ font-family:'IBM Plex Mono',monospace; }

  a, button{ font-family:inherit; }
  button{ cursor:pointer; transition:transform .13s ease, background-color .18s ease, border-color .18s ease, opacity .18s ease, box-shadow .18s ease; }
  button:not(:disabled):active{ transform:translateY(1px) scale(.975); }
  a{ transition:color .18s ease, opacity .18s ease; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:3px solid var(--safety);
    outline-offset:1px;
  }

  /* ---- top bar ---- */
  header.bar{
    background:var(--bar);
    color:var(--ink);
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:5px solid var(--safety);
  }
  header.bar .brand{
    font:600 20px/1 'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.04em;
    display:flex;
    align-items:center;
    gap:10px;
  }
  header.bar .brand .crate{ font-size:22px; }
  .build-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    margin-left:7px;
    padding:3px 7px;
    border:1px solid rgba(242,183,5,.55);
    color:var(--safety);
    background:rgba(242,183,5,.09);
    font:500 10px/1 'IBM Plex Mono',monospace;
    letter-spacing:.04em;
    white-space:nowrap;
  }
  header.bar .who{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:13px;
    color:var(--muted);
  }
  header.bar .who .roles{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    background:rgba(242,183,5,.14);
    color:var(--safety);
    padding:2px 7px;
    border-radius:2px;
    letter-spacing:.03em;
  }
  .theme-select{
    background:var(--surface2);color:var(--ink);border:1px solid var(--line);
    padding:6px 8px;border-radius:var(--radius);font-size:12px;
  }
  header.bar button.link{
    background:none;
    border:none;
    color:var(--ink);
    text-decoration:underline;
    font-size:13px;
    padding:0;
  }

  /* ---- tabs ---- */
  nav.tabs{
    display:flex;
    gap:2px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:0 20px;
  }
  nav.tabs button{
    transition:color .2s ease, border-color .2s ease, transform .15s ease;
    background:none;
    border:none;
    padding:13px 4px;
    margin-right:22px;
    font:600 13px/1 'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--muted);
    border-bottom:3px solid transparent;
  }
  nav.tabs button.active{
    color:var(--ink);
    border-bottom-color:var(--safety);
  }

  main{
    max-width:1180px;
    margin:0 auto;
    padding:22px 20px 80px;
    display:grid;
    grid-template-columns:1fr 320px;
    gap:24px;
    align-items:start;
  }
  main.setup-only{
    grid-template-columns:minmax(0,760px);
    justify-content:center;
  }
  main.setup-only .slip{
    position:static;
    max-height:none;
    overflow:visible;
  }
  .feature-banner{
    border:1px solid var(--line);
    border-left:5px solid var(--safety);
    background:linear-gradient(135deg,rgba(242,183,5,.10),rgba(49,54,59,.72));
    padding:13px 14px;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
  }
  .feature-banner strong{
    display:block;
    font:600 15px 'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .feature-banner span{
    display:block;
    margin-top:3px;
    color:var(--muted);
    font-size:12px;
    line-height:1.4;
  }
  .feature-banner button{
    flex:0 0 auto;
    background:var(--safety);
    color:var(--safety-ink);
    border:0;
    padding:10px 12px;
    border-radius:var(--radius);
    font:600 12px 'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .setup-empty-warning{
    border:1px dashed var(--rust);
    background:rgba(224,98,72,.07);
    color:var(--ink);
    padding:10px 11px;
    font-size:12px;
    line-height:1.4;
  }
  @media (max-width:880px){
    main{ grid-template-columns:1fr; }
    .slip{ position:static; max-height:none; overflow:visible; }
  }

  .toolbar{
    display:flex;
    gap:10px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .toolbar input[type=search], .toolbar select{
    padding:9px 11px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--surface2);
    font-size:13px;
    color:var(--ink);
  }
  .toolbar input[type=search]{ flex:1; min-width:180px; }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:14px;
  }

  /* ---- item tag card ---- */
  .tag{
    background:var(--surface);
    transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    border:1px solid var(--line);
    border-radius:var(--radius);
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .tag:hover{ transform:translateY(-3px); border-color:#596168; box-shadow:0 10px 24px rgba(0,0,0,.22); }
  .tag:focus-within{ border-color:var(--safety); }
  .tag .perf{
    height:0;
    border-top:2px dashed var(--line);
    margin:0 14px;
    position:relative;
    top:14px;
  }
  .tag .photo{
    height:160px;
    position:relative;
    background:var(--surface2);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--line);
    border-bottom:1px solid var(--line);
  }
  .tag .photo img{ width:100%; height:100%; object-fit:contain; padding:10px; cursor:zoom-in; transition:transform .25s ease, opacity .2s ease; }
  .tag:hover .photo img{ transform:scale(1.025); }
  .tag .colordot{
    position:absolute;
    top:8px;
    right:8px;
    width:16px;
    height:16px;
    border-radius:50%;
    border:2px solid var(--ink);
    box-shadow:0 0 0 2px var(--bar);
  }
  .favorite-btn{
    position:absolute;top:8px;left:8px;z-index:3;width:36px;height:36px;
    border:1px solid var(--line);background:rgba(20,22,24,.84);color:#C8C4B9;
    border-radius:50%;font-size:20px;display:grid;place-items:center;
  }
  .favorite-btn.active{color:var(--safety);border-color:var(--safety);}
  .stock-badge{
    position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:2;
    padding:5px 10px;border:1px solid currentColor;background:rgba(20,22,24,.92);
    font:700 11px 'Oswald',sans-serif;letter-spacing:.07em;text-transform:uppercase;
    white-space:nowrap;
  }
  .stock-badge.in_stock{color:var(--ok)}
  .stock-badge.low_stock{color:var(--safety)}
  .stock-badge.out_of_stock{color:#fff;background:rgba(169,48,35,.96);font-size:13px;}
  .tag.out-of-stock .photo img{opacity:.38;filter:grayscale(.7)}
  .tag.out-of-stock{border-color:rgba(224,98,72,.75)}
  .cat-section{ margin-bottom:22px; }
  .cat-head{
    font:600 13px 'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--safety);
    border-bottom:1px solid var(--line);
    padding-bottom:6px;
    margin-bottom:12px;
    display:flex;
    justify-content:space-between;
  }
  .cat-head .n{ color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:11px; }
  .tag .body{ padding:12px 14px 14px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .tag .code{
    font-size:11px;
    color:var(--muted);
    letter-spacing:.03em;
  }
  .tag .name{ font-weight:600; font-size:14.5px; line-height:1.3; }
  .tag .meta{ font-size:12px; color:var(--muted); }
  .tag .row-bottom{
    margin-top:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .tag .stock{
    font-size:11px;
    font-family:'IBM Plex Mono',monospace;
  }
  .tag .stock.low{ color:var(--rust); }
  .tag .stepper{
    display:flex;
    align-items:center;
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .tag .stepper button{
    background:var(--surface2);
    color:var(--ink);
    border:none;
    width:26px;
    height:26px;
    font-size:15px;
    line-height:1;
  }
  .tag .stepper button:disabled{ opacity:.35; cursor:not-allowed; }
  .tag .stepper .qty{
    width:42px;
    height:26px;
    border:0;
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    padding:0 3px;
    -moz-appearance:textfield;
  }
  .tag .stepper .qty::-webkit-outer-spin-button,
  .tag .stepper .qty::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .tag .photo-fallback{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:100%;
    font-size:28px;
    opacity:.5;
  }
  .card-actions{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:4px; }
  .estimated-mark{ display:flex; align-items:center; gap:5px; color:var(--muted); font-size:10.5px; }
  .estimated-mark input{ accent-color:var(--safety); }
  .request-count{ background:none; border:1px solid var(--line); color:var(--muted); padding:5px 7px; border-radius:var(--radius); font-size:10px; }
  .request-count:hover{ color:var(--ink); border-color:var(--safety); }

  /* ---- order slip (cart) ---- */
  .slip{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    position:sticky;
    top:20px;
    max-height:calc(100vh - 40px);
    overflow-y:auto;
  }
  .slip .slip-head{
    padding:14px 16px 10px;
    border-bottom:2px dashed var(--line);
  }
  .slip .slip-head .label{ font-size:12px; color:var(--muted); }
  .slip .slip-head h2{
    margin:2px 0 0;
    font:600 18px 'Oswald',sans-serif;
    text-transform:uppercase;
  }
  .slip .lines{ padding:10px 16px; display:flex; flex-direction:column; gap:8px; max-height:280px; overflow-y:auto; }
  .slip .empty{ color:var(--muted); font-size:13px; padding:8px 0; }
  .slip .line{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    gap:8px;
  }
  .slip .line .nm{ flex:1; }
  .slip .line .nm .cd{ display:block; font-size:10.5px; color:var(--muted); font-family:'IBM Plex Mono',monospace; }
  .slip .line button.rm{
    background:none;
    border:none;
    color:var(--rust);
    font-size:16px;
    padding:0 2px;
  }
  .slip .foot{ padding:12px 16px 16px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:10px; }
  .slip select, .slip textarea, .slip input[type=text],
  .slip input[type=date], .slip input[type=number]{
    width:100%;
    padding:8px 9px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--surface2);
    color:var(--ink);
    font-size:13px;
    font-family:inherit;
  }
  .slip textarea{ min-height:52px; resize:vertical; }
  .project-builder{
    border:1px solid var(--line);
    background:rgba(20,22,24,.32);
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .slip .mini-label{
    display:block;
    color:var(--muted);
    font-size:10.5px;
    margin-bottom:4px;
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  .project-builder .two-col{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .project-builder .save-project{
    display:flex;
    align-items:flex-start;
    gap:8px;
    color:var(--muted);
    font-size:11.5px;
    line-height:1.35;
  }
  .project-builder .save-project input{
    width:auto;
    margin-top:2px;
    accent-color:var(--safety);
  }
  .project-help{
    color:var(--muted);
    font-size:11px;
    line-height:1.35;
  }
  .address-box{
    border-top:1px dashed var(--line);
    margin-top:2px;
    padding-top:9px;
  }
  .address-box h3{
    margin:0 0 8px;
    font:600 13px 'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .shipping-plan{
    border:1px solid var(--line);
    border-left:4px solid var(--safety);
    background:var(--surface2);
    padding:9px 10px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px 10px;
  }
  .shipping-plan .plan-item span{
    display:block;
    color:var(--muted);
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .shipping-plan .plan-item strong{
    display:block;
    margin-top:2px;
    font:600 12px 'IBM Plex Mono',monospace;
  }
  .shipping-plan .plan-wide{ grid-column:1 / -1; }
  .shipping-plan.due{ border-left-color:var(--rust); }
  .shipping-note{
    grid-column:1 / -1;
    color:var(--muted);
    font-size:10px;
    line-height:1.35;
  }
  .map-reference summary{
    cursor:pointer;
    color:var(--muted);
    font-size:10.5px;
  }
  .map-reference img{
    display:block;
    width:100%;
    margin-top:7px;
    border:1px solid var(--line);
    background:#000;
  }
  .saved-project-card{
    border:1px solid var(--line);
    background:var(--surface2);
    padding:9px;
    font-size:11px;
    line-height:1.5;
  }
  .saved-project-card strong{ color:var(--ink); }
  .btn-primary{
    background:var(--safety);
    color:var(--safety-ink);
    border:none;
    padding:11px;
    border-radius:var(--radius);
    font:600 13px 'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  .btn-primary:disabled{ opacity:.4; cursor:not-allowed; }
  .total-count{ font-size:12px; color:var(--muted); }

  /* ---- toast ---- */
  #toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translate(-50%,18px);
    background:var(--bar);
    color:var(--ink);
    padding:12px 18px;
    border-radius:var(--radius);
    border-left:4px solid var(--safety);
    font-size:13px;
    max-width:420px;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .22s ease, transform .22s ease, visibility .22s;
    z-index:80;
  }
  #toast.show{ opacity:1; visibility:visible; transform:translate(-50%,0); }
  #toast.err{ border-left-color:var(--rust); }

  /* ---- orders tab ---- */
  .orders-list{ display:flex; flex-direction:column; gap:10px; }
  .order-card{
    background:var(--surface);
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .order-card:hover{ transform:translateY(-2px); border-color:#596168; box-shadow:0 8px 20px rgba(0,0,0,.16); }
  .order-card.incomplete{ border-left:4px solid var(--rust); }
  .order-card .top-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .order-card .oid{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); }
  .order-card .proj{ font-size:13px; color:var(--muted); margin-top:2px; }
  .order-card .proj-meta{ font-size:11.5px; color:var(--muted); margin-top:3px; }
  .stamp{
    font:700 11px 'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.06em;
    padding:4px 9px;
    border:2px solid currentColor;
    border-radius:2px;
    transform:rotate(-2deg);
    white-space:nowrap;
  }
  .stamp.pending{ color:var(--muted); }
  .stamp.approved{ color:var(--ok); }
  .stamp.picking{ color:var(--safety); }
  .stamp.rejected{ color:var(--rust); }
  .stamp.fulfilled{ color:var(--ink); }
  .order-card .lines-mini{ margin-top:10px; font-size:12.5px; color:var(--ink); }
  .order-card .lines-mini div{ display:flex; justify-content:space-between; padding:2px 0; border-bottom:1px dotted var(--line); }
  .order-card .lines-mini div:last-child{ border-bottom:none; }
  .order-card .notes{ margin-top:8px; font-size:12.5px; color:var(--muted); font-style:italic; }
  .incomplete-note{ margin-top:8px; padding:7px 9px; border:1px dashed var(--rust); color:var(--rust); font-size:11.5px; background:rgba(224,98,72,.06); }
  .order-actions{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .btn-secondary{ background:var(--surface2); color:var(--ink); border:1px solid var(--line); padding:8px 10px; border-radius:var(--radius); font:600 11px 'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.04em; }
  .estimate-pill{ color:var(--safety); font-size:9px; border:1px solid rgba(242,183,5,.45); padding:1px 4px; margin-left:5px; }
  .tracking-box{ margin-top:10px; border-top:1px dashed var(--line); padding-top:9px; font-size:12px; }
  .proof-strip{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .proof-strip img{ width:88px; height:70px; object-fit:cover; border:1px solid var(--line); cursor:zoom-in; transition:transform .18s ease, border-color .18s ease; }
  .proof-strip img:hover{ transform:translateY(-2px); border-color:var(--safety); }
  .proof-strip img:not([src]){ opacity:.45; background:var(--surface2); }

  /* ---- login screen ---- */
  .login-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .login-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    width:340px;
    max-width:100%;
    padding:26px 24px 24px;
  }
  .login-card .brand{
    font:600 22px 'Oswald',sans-serif;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:4px;
  }
  .login-card .sub{ font-size:12.5px; color:var(--muted); margin-bottom:20px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:5px; }
  .field input{
    width:100%;
    padding:10px 11px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--surface2);
    color:var(--ink);
    font-size:14px;
  }
  .server-field input{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--surface2);
    color:var(--ink);
    font-size:12.5px;
  }
  .err-line{ color:var(--rust); font-size:12.5px; margin:-6px 0 14px; }
  .server-toggle{
    font-size:11.5px;
    color:var(--muted);
    background:none;
    border:none;
    text-decoration:underline;
    padding:0;

<script>
/* ---------------------------------------------------------------------
   Oti-Warehouse Swag — ordering frontend.
   Static file, no build step — open it from the shared drive or host it
   next to the backend. Talks to the FastAPI backend over bearer-token
   auth (see backend/main.py for the CORS rationale).
   ------------------------------------------------------------------- */

// When this page is served BY the backend itself (Render, or any host
// running main.py), talking to "itself" is exactly right — no manual
// server address needed at all, which matters most on a phone where
// typing a URL into a settings field is annoying. Opening the file
// directly (file://) has no real origin to detect, so that case keeps
// the old localhost default for local testing.
const APP_VERSION = "5.9";
const DEFAULT_API_BASE =
  (location.protocol === "file:" || !location.origin || location.origin === "null")
    ? "http://localhost:8000"
    : location.origin;

// Conservative state-level defaults transcribed from the supplied UPS Ground
// outbound map. Several states contain more than one ZIP-level zone, so the
// transit time is locked to the supplied UPS state map.
const GROUND_DAYS_BY_STATE = {
  CT:1, DC:1, DE:1, MA:1, MD:1, NJ:1, NY:1, PA:1, RI:1, VT:1,
  GA:2, IN:2, KY:2, ME:2, MI:2, NC:2, NH:2, OH:2, SC:2, TN:2, VA:2, WV:2,
  AL:3, AR:3, AZ:3, FL:3, IA:3, IL:3, KS:3, LA:3, MN:3, MO:3, MS:3, NE:3, NM:3, WI:3,
  CO:4, MT:4, ND:4, OK:4, SD:4, TX:4,
  AK:5, CA:5, HI:5, ID:5, NV:5, OR:5, PR:5, UT:5, VI:5, WA:5, WY:5,
};
const US_STATES = [
  ["AL","Alabama"],["AK","Alaska"],["AZ","Arizona"],["AR","Arkansas"],
  ["CA","California"],["CO","Colorado"],["CT","Connecticut"],["DE","Delaware"],
  ["DC","District of Columbia"],["FL","Florida"],["GA","Georgia"],["HI","Hawaii"],
  ["ID","Idaho"],["IL","Illinois"],["IN","Indiana"],["IA","Iowa"],
  ["KS","Kansas"],["KY","Kentucky"],["LA","Louisiana"],["ME","Maine"],
  ["MD","Maryland"],["MA","Massachusetts"],["MI","Michigan"],["MN","Minnesota"],
  ["MS","Mississippi"],["MO","Missouri"],["MT","Montana"],["NE","Nebraska"],
  ["NV","Nevada"],["NH","New Hampshire"],["NJ","New Jersey"],["NM","New Mexico"],
  ["NY","New York"],["NC","North Carolina"],["ND","North Dakota"],["OH","Ohio"],
  ["OK","Oklahoma"],["OR","Oregon"],["PA","Pennsylvania"],["PR","Puerto Rico"],
  ["RI","Rhode Island"],["SC","South Carolina"],["SD","South Dakota"],["TN","Tennessee"],
  ["TX","Texas"],["UT","Utah"],["VT","Vermont"],["VA","Virginia"],
  ["VI","U.S. Virgin Islands"],["WA","Washington"],["WV","West Virginia"],
  ["WI","Wisconsin"],["WY","Wyoming"],
];

function parseIsoDate(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(value || "")) return null;
  const [y,m,d] = value.split("-").map(Number);
  const result = new Date(y, m - 1, d, 12, 0, 0);
  return result.getFullYear() === y && result.getMonth() === m - 1 && result.getDate() === d ? result : null;
}
function isoFromDate(value) {
  const y = value.getFullYear();
  const m = String(value.getMonth() + 1).padStart(2, "0");
  const d = String(value.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}
function observedFixed(year, monthIndex, day) {
  const d = new Date(year, monthIndex, day, 12);
  if (d.getDay() === 6) d.setDate(d.getDate() - 1);
  else if (d.getDay() === 0) d.setDate(d.getDate() + 1);
  return d;
}
function nthWeekday(year, monthIndex, weekday, n) {
  const d = new Date(year, monthIndex, 1, 12);
  d.setDate(1 + ((weekday - d.getDay() + 7) % 7) + (n - 1) * 7);
  return d;
}
function lastWeekday(year, monthIndex, weekday) {
  const d = new Date(year, monthIndex + 1, 0, 12);
  d.setDate(d.getDate() - ((d.getDay() - weekday + 7) % 7));
  return d;
}
function federalHolidaySet(year) {
  return new Set([
    observedFixed(year,0,1), nthWeekday(year,0,1,3), nthWeekday(year,1,1,3),
    lastWeekday(year,4,1), observedFixed(year,5,19), observedFixed(year,6,4),
    nthWeekday(year,8,1,1), nthWeekday(year,9,1,2), observedFixed(year,10,11),
    nthWeekday(year,10,4,4), observedFixed(year,11,25),
  ].map(isoFromDate));
}
function isBusinessDate(value) {
  if (value.getDay() === 0 || value.getDay() === 6) return false;
  const iso = isoFromDate(value);
  for (const y of [value.getFullYear()-1, value.getFullYear(), value.getFullYear()+1]) {
    if (federalHolidaySet(y).has(iso)) return false;
  }
  return true;
}
function previousBusinessDate(value) {
  const d = new Date(value);
  do { d.setDate(d.getDate() - 1); } while (!isBusinessDate(d));
  return d;
}
function subtractBusinessDates(value, count) {
  const d = new Date(value);
  let left = Number(count) || 0;
  while (left > 0) {
    d.setDate(d.getDate() - 1);
    if (isBusinessDate(d)) left -= 1;
  }
  return d;
}
function shippingPlanForForm(form) {
  const event = parseIsoDate(form.eventDate);
  const stateCode = (form.shippingState || "").toUpperCase();
  const days = GROUND_DAYS_BY_STATE[stateCode];
  if (!event || !days) return null;
  const delivery = previousBusinessDate(event);
  const shipBy = subtractBusinessDates(delivery, days);
  return { deliveryDate: isoFromDate(delivery), shipByDate: isoFromDate(shipBy), days };
}
function stateOptions(selected) {
  return `<option value="">Select state</option>` + US_STATES.map(([code,name]) =>
    `<option value="${code}" ${selected === code ? "selected" : ""}>${name}</option>`).join("");
}
function formattedAddress(project) {
  if (!project) return "";
  const street = [project.shipping_address1, project.shipping_address2].filter(Boolean).join(", ");
  const cityLine = [project.shipping_city, project.shipping_state, project.shipping_postal_code].filter(Boolean).join(" ");
  return [street, cityLine].filter(Boolean).join(" · ");
}

const state = {
  apiBase: sessionStorage.getItem("oti_api_base") || DEFAULT_API_BASE,
  token: sessionStorage.getItem("oti_token") || null,
  user: null,
  theme: localStorage.getItem("oti_theme") || "warehouse-dark",
  tab: "catalog",
  catalog: [],
  projects: [],
  cart: {},           // committed item_id -> qty
  estimated: {},      // committed item_id -> quantity is still an estimate
  draftQty: {},       // catalog controls before Add / Update Cart
  draftEstimated: {},
  orderForm: {
    projectChoice: "new",
    projectName: "",
    projectOwner: "",
    eventDate: "",
    projectLocation: "",
    shippingAddress1: "",
    shippingAddress2: "",
    shippingCity: "",
    shippingState: "",
    shippingPostalCode: "",
    attendees: "",
    projectDescription: "",
    saveProject: false,
    notes: "",
  },
  myOrders: [],
  proofUrls: {},       // proof photo id -> authenticated object URL
  search: "",
  category: "",
  sort: "name",
  quickFilter: "all",
  filterDrawerOpen: false,
  filterCollapsed: localStorage.getItem("oti_filter_collapsed") === "1",
  recentlyViewed: JSON.parse(localStorage.getItem("oti_recent_items") || "[]"),
  loadingCatalog: false,
  loadingOrders: false,
  loginError: "",
  showServerField: false,
  polling: false,
  lastPollTime: null,
};

let pollAbort = null;

function effectiveTheme(choice) {
  if (choice !== "system") return choice;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
    ? "light" : "warehouse-dark";
}
function applyTheme(choice) {
  state.theme = choice || "warehouse-dark";
  localStorage.setItem("oti_theme", state.theme);
  document.documentElement.dataset.theme = effectiveTheme(state.theme);
}
applyTheme(state.theme);
if (window.matchMedia) window.matchMedia("(prefers-color-scheme: light)").addEventListener?.("change", () => {
  if (state.theme === "system") applyTheme("system");
});

// ---- fetch helper --------------------------------------------------------
async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  if (opts.body) headers["Content-Type"] = "application/json";
  if (state.token) headers["Authorization"] = "Bearer " + state.token;

  let res;
  try {
    res = await fetch(state.apiBase + path, Object.assign({}, opts, { headers }));
  } catch (e) {
    throw new Error("Couldn't reach the server at " + state.apiBase + ". Check the server address and that the backend is running.");
  }

  if (res.status === 401) {
    logout("Your session expired. Log in again.");
    throw new Error("Session expired.");
  }

  if (!res.ok) {
    let detail = "Request failed (" + res.status + ").";
    try {
      const body = await res.json();
      if (body && body.detail) detail = typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail);
    } catch (_) {}
    throw new Error(detail);
  }
  if (res.status === 204) return null;
  return res.json();
}

function saveSession() {
  if (state.token) sessionStorage.setItem("oti_token", state.token);
  sessionStorage.setItem("oti_api_base", state.apiBase);
}

function blankOrderForm() {
  return {
    projectChoice: "new",
    projectName: "",
    projectOwner: state.user ? (state.user.full_name || state.user.username || "") : "",
    eventDate: "",
    projectLocation: "",
    shippingAddress1: "",
    shippingAddress2: "",
    shippingCity: "",
    shippingState: "",
    shippingPostalCode: "",
    attendees: "",
    projectDescription: "",
    saveProject: false,
    notes: "",
  };
}

function logout(message) {
  stopPolling();
  state.token = null;
  state.user = null;
  state.cart = {};
  state.estimated = {};
  state.draftQty = {};
  state.draftEstimated = {};
  state.filterDrawerOpen = false;
  state.orderForm = blankOrderForm();
  state.myOrders = [];
  Object.values(state.proofUrls).forEach(url => URL.revokeObjectURL(url));
  state.proofUrls = {};
  sessionStorage.removeItem("oti_token");
  state.loginError = message || "";
  render();
}

// ---- toast ----------------------------------------------------------------
let toastTimer = null;
function toast(message, isErr) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.className = (isErr ? "err " : "") + "show";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove("show"); }, 4200);
}

function loadingMarkup(label) {
  return `<div class="loading"><div class="spinner" aria-hidden="true"></div>${esc(label)}</div>`;
}

function renderWithTransition() {
  if (document.startViewTransition) document.startViewTransition(() => render());
  else render();
}

function openLightbox(src, alt) {
  const box = document.getElementById("lightbox");
  const img = box.querySelector("img");
  img.src = src;
  img.alt = alt || "Expanded photo";
  box.classList.add("open");
  box.setAttribute("aria-hidden", "false");
}
function closeLightbox() {
  const box = document.getElementById("lightbox");
  box.classList.remove("open");
  box.setAttribute("aria-hidden", "true");
}
function openModal(html) {
  const root = document.getElementById("modal-root");
  root.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true">${html}</div>`;
  root.classList.add("open");
  root.setAttribute("aria-hidden", "false");
}
function closeModal() {
  const root = document.getElementById("modal-root");
  root.classList.remove("open");
  root.setAttribute("aria-hidden", "true");
  setTimeout(() => { if (!root.classList.contains("open")) root.innerHTML = ""; }, 210);
}

async function loadProtectedProofImages() {
  const pending = [...document.querySelectorAll("img[data-proof-id]")];
  await Promise.all(pending.map(async img => {
    const id = Number(img.dataset.proofId);
    if (state.proofUrls[id]) {
      img.src = state.proofUrls[id];
      img.dataset.lightboxSrc = state.proofUrls[id];
      return;
    }
    try {
      const res = await fetch(state.apiBase + "/order-proof/" + id, {
        headers: { "Authorization": "Bearer " + state.token },
      });
      if (!res.ok) throw new Error("Proof photo failed to load.");
      const url = URL.createObjectURL(await res.blob());
      state.proofUrls[id] = url;
      if (img.isConnected) {
        img.src = url;
        img.dataset.lightboxSrc = url;
      }
    } catch (_) {
      if (img.isConnected) img.alt = "Proof photo unavailable";
    }
  }));
}

// ---- data loading -----------------------------------------------------------
async function loadCatalog() {
  state.loadingCatalog = true; render();
  try {
    const [items, projects] = await Promise.all([
      api("/catalog"),
      api("/projects"),
    ]);
    state.catalog = items;
    state.projects = projects;
  } catch (e) {
    toast(e.message, true);
  } finally {
    state.loadingCatalog = false; render();
  }
}

async function loadMyOrders() {
  state.loadingOrders = true; render();
  try {
    const orders = await api("/orders/my");
    state.myOrders = orders;
    state.lastPollTime = new Date().toISOString();
  } catch (e) {
    toast(e.message, true);
  } finally {
    state.loadingOrders = false; render();
  }
}

function stopPolling() {
  state.polling = false;
  if (pollAbort) pollAbort.aborted = true;
}

async function pollLoop() {
  if (state.polling) return;
  state.polling = true;
  const myGate = { aborted: false };
  pollAbort = myGate;
  while (!myGate.aborted && state.token) {
    try {
      const since = encodeURIComponent(state.lastPollTime || new Date().toISOString());
      const res = await api("/orders/updates?since=" + since);
      if (myGate.aborted) break;
      state.lastPollTime = res.server_time;
      if (res.orders && res.orders.length) {
        const byId = Object.fromEntries(state.myOrders.map(o => [o.id, o]));
        res.orders.forEach(o => {
          if (o.deleted) delete byId[o.id];
          else byId[o.id] = o;
        });
        state.myOrders = Object.values(byId).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        if (state.tab === "orders") render();
        res.orders.forEach(o => {
          toast(o.deleted ? ("Order #" + o.id + " was deleted.") : ("Order #" + o.id + " is now " + o.status + "."));
        });
      }
    } catch (e) {
      if (myGate.aborted) break;
      await new Promise(r => setTimeout(r, 4000));
    }
  }
}

// ---- cart -------------------------------------------------------------------
function cartCount() {
  return Object.values(state.cart).reduce((a, b) => a + b, 0);
}
function hasOwn(object, key) {
  return Object.prototype.hasOwnProperty.call(object, key);
}
function draftQtyFor(item) {
  return hasOwn(state.draftQty, item.id) ? Number(state.draftQty[item.id] || 0) : Number(state.cart[item.id] || 0);
}
function draftEstimatedFor(itemId) {
  return hasOwn(state.draftEstimated, itemId)
    ? Boolean(state.draftEstimated[itemId])
    : Boolean(state.estimated[itemId]);
}
function setDraftQty(itemId, qty, max) {
  qty = Number.isFinite(Number(qty)) ? Math.floor(Number(qty)) : 0;
  qty = Math.max(0, Math.min(qty, max));
  state.draftQty[itemId] = qty;
  if (qty === 0) state.draftEstimated[itemId] = false;
  render();
}
function markRecentlyViewed(itemId) {
  state.recentlyViewed = [Number(itemId), ...state.recentlyViewed.filter(id => Number(id) !== Number(itemId))].slice(0, 20);
  localStorage.setItem("oti_recent_items", JSON.stringify(state.recentlyViewed));
}
function commitItemToCart(itemId) {
  const item = state.catalog.find(i => i.id === Number(itemId));
  if (!item) return;
  const qty = draftQtyFor(item);
  if (!Number.isInteger(qty) || qty <= 0) {
    toast("Enter a quantity before adding this item.", true);
    return;
  }
  if (qty > item.qty_on_hand) {
    toast("Only " + item.qty_on_hand + " are currently available.", true);
    return;
  }
  const updating = Boolean(state.cart[item.id]);
  state.cart[item.id] = qty;
  if (draftEstimatedFor(item.id)) state.estimated[item.id] = true;
  else delete state.estimated[item.id];
  state.draftQty[item.id] = qty;
  state.draftEstimated[item.id] = Boolean(state.estimated[item.id]);
  markRecentlyViewed(item.id);
  render();
  toast(updating ? (item.name + " updated in the cart.") : (item.name + " added to the cart."));
}

function buildProjectPayload() {
  const f = state.orderForm;
  if (f.projectChoice === "none") return {};
  if (f.projectChoice.startsWith("saved:")) {
    const projectId = Number(f.projectChoice.split(":", 2)[1]);
    const saved = state.projects.find(p => p.id === projectId);
    if (!saved) throw new Error("That saved project is no longer available.");
    if (saved.address_mode === "fixed") return { project_id: projectId };
    const plan = shippingPlanForForm(f);
    const attendees = f.attendees === "" ? saved.attendees : Number(f.attendees);
    return {
      project_id: projectId,
      new_project: {
        name: saved.name, owner: saved.owner || f.projectOwner.trim(),
        event_date: f.eventDate || saved.event_date || "",
        delivery_date: plan ? plan.deliveryDate : "",
        ship_by_date: plan ? plan.shipByDate : "",
        location: f.projectLocation.trim() || saved.location || "",
        shipping_address1: f.shippingAddress1.trim(),
        shipping_address2: f.shippingAddress2.trim(),
        shipping_city: f.shippingCity.trim(),
        shipping_state: f.shippingState,
        shipping_postal_code: f.shippingPostalCode.trim(),
        shipping_service: "UPS Ground", ups_ground_days: plan ? plan.days : null,
        attendees: attendees == null || attendees === "" ? null : attendees,
        description: saved.description || "", address_mode: "variable",
      },
      save_project: false,
    };
  }
  if (!f.projectName.trim()) throw new Error("Enter a project or event name for this order.");
  if (!f.eventDate) throw new Error("Enter the event date.");
  const plan = shippingPlanForForm(f);
  const attendees = f.attendees === "" ? null : Number(f.attendees);
  if (attendees != null && (!Number.isInteger(attendees) || attendees < 0)) {
    throw new Error("Attendees must be a whole number of zero or more.");
  }
  return {
    new_project: {
      name: f.projectName.trim(), owner: f.projectOwner.trim(),
      event_date: f.eventDate,
      delivery_date: plan ? plan.deliveryDate : "",
      ship_by_date: plan ? plan.shipByDate : "",
      location: f.projectLocation.trim(),
      shipping_address1: f.shippingAddress1.trim(),
      shipping_address2: f.shippingAddress2.trim(),
      shipping_city: f.shippingCity.trim(),
      shipping_state: f.shippingState,
      shipping_postal_code: f.shippingPostalCode.trim(),
      shipping_service: "UPS Ground",
      ups_ground_days: plan ? plan.days : null,
      attendees, description: f.projectDescription.trim(),
    },
    save_project: Boolean(f.saveProject),
  };
}

async function submitOrder() {
  const lines = Object.entries(state.cart).map(([item_id, qty]) => ({
    item_id: Number(item_id), qty, estimated: Boolean(state.estimated[item_id])
  }));
  if (!lines.length) return;
  let projectPayload;
  try {
    projectPayload = buildProjectPayload();
  } catch (e) {
    toast(e.message, true);
    return;
  }
  try {
    const order = await api("/orders", {
      method: "POST",
      body: JSON.stringify(Object.assign({
        notes: state.orderForm.notes.trim(),
        lines,
      }, projectPayload)),
    });
    const savedForReuse = Boolean(projectPayload.save_project);
    state.cart = {};
    state.estimated = {};
    state.draftQty = {};
    state.draftEstimated = {};
    state.orderForm = blankOrderForm();
    if (savedForReuse) {
      try { state.projects = await api("/projects"); } catch (_) {}
    }
    toast("Order #" + order.id + " submitted — pending approval.");
    state.tab = "orders";
    await loadMyOrders();
  } catch (e) {
    toast(e.message, true);
    render();
  }
}

// ---- auth -------------------------------------------------------------------
async function doLogin(username, password) {
  state.loginError = "";
  try {
    const res = await fetch(state.apiBase + "/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || "Invalid username or password.");
    }
    const data = await res.json();
    state.token = data.token;
    state.user = data.user;
    applyTheme(data.user.theme || state.theme);
    state.orderForm = blankOrderForm();
    saveSession();
    await Promise.all([loadCatalog(), loadMyOrders()]);
    pollLoop();
  } catch (e) {
    state.loginError = e.message.includes("fetch") || e.message.includes("reach")
      ? "Couldn't reach the server at " + state.apiBase + ". Check the server address."
      : e.message;
  }
  render();
}

// ---- rendering ----------------------------------------------------------------
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

function imgUrl(item) {
  if (!item.images || !item.images.length) return null;
  // The item endpoint skips stale legacy records and serves the first photo
  // whose bytes still exist, including DB-backed uploads.
  return state.apiBase + "/catalog/" + encodeURIComponent(item.id) + "/image?access_token=" + encodeURIComponent(state.token || "");
}

function handleImageError(img) {
  const holder = img && img.closest ? img.closest(".photo") : null;
  if (!holder) return;
  img.remove();
  if (!holder.querySelector(".photo-fallback")) {
    const fallback = document.createElement("span");
    fallback.className = "photo-fallback";
    fallback.textContent = "📦";
    fallback.title = "Photo file is missing from the server";
    holder.prepend(fallback);
  }
}

function frequentItemIds() {
  const counts = new Map();
  state.myOrders.forEach(order => (order.lines || []).forEach(line => {
    counts.set(Number(line.item_id), (counts.get(Number(line.item_id)) || 0) + Number(line.qty_requested || 0));
  }));
  return [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 10).map(([id]) => id);
}

function quickFilterCounts() {
  const frequent = new Set(frequentItemIds());
  const recent = new Set(state.recentlyViewed.map(Number));
  return {
    all: state.catalog.length,
    low: state.catalog.filter(i => i.qty_on_hand <= i.reorder_threshold).length,
    recount: state.catalog.filter(i => Number(i.open_count_requests || 0) > 0).length,
    frequent: state.catalog.filter(i => frequent.has(Number(i.id))).length,
    recent: state.catalog.filter(i => recent.has(Number(i.id))).length,
    favorites: state.catalog.filter(i => Boolean(i.favorite)).length,
  };
}

function filteredCatalog() {
  const q = state.search.trim().toLowerCase();
  const frequent = new Set(frequentItemIds());
  const recent = new Set(state.recentlyViewed.map(Number));
  const items = state.catalog.filter(i => {
    if (state.category && i.category !== state.category) return false;
    if (state.quickFilter === "low" && i.qty_on_hand > i.reorder_threshold) return false;
    if (state.quickFilter === "recount" && Number(i.open_count_requests || 0) <= 0) return false;
    if (state.quickFilter === "frequent" && !frequent.has(Number(i.id))) return false;
    if (state.quickFilter === "recent" && !recent.has(Number(i.id))) return false;
    if (state.quickFilter === "favorites" && !i.favorite) return false;
    if (!q) return true;
    return (i.name + " " + i.code + " " + (i.description || "") + " " + (i.location || "")).toLowerCase().includes(q);
  });
  const by = state.sort;
  items.sort((a, b) => {
    if (state.quickFilter === "favorites" && a.favorite !== b.favorite) return a.favorite ? -1 : 1;
    if (state.quickFilter === "recent" && by === "name") {
      return state.recentlyViewed.indexOf(Number(a.id)) - state.recentlyViewed.indexOf(Number(b.id));
    }
    if (by === "code") return a.code.localeCompare(b.code);
    if (by === "stock") return a.qty_on_hand - b.qty_on_hand;
    if (by === "location") return String(a.location || "~~~~").localeCompare(String(b.location || "~~~~"), undefined, { numeric:true });
    return a.name.localeCompare(b.name);
  });
  return items;
}

function groupByCategory(items) {
  const groups = new Map();
  items.forEach(i => {
    const key = i.category || "Uncategorized";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(i);
  });
  return [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0]));
}

async function submitCountRequest(itemId, itemName) {
  openModal(`
    <h2>Request Count</h2>
    <div class="modal-sub">Flag ${esc(itemName)} for a physical recount. Add a note only when useful.</div>
    <label for="count-note">Optional note</label>
    <textarea id="count-note" maxlength="255" placeholder="Example: looks low, discrepancy, or last count is old"></textarea>
    <div id="count-error" class="err-line" style="margin:8px 0 0;"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="count-cancel">Cancel</button>
      <button class="btn-primary" id="count-submit">Send Request</button>
    </div>`);
  document.getElementById("count-cancel").onclick = closeModal;
  document.getElementById("count-submit").onclick = async () => {
    const button = document.getElementById("count-submit");
    button.disabled = true;
    button.textContent = "Sending…";
    try {
      await api(`/catalog/${itemId}/count-requests`, {
        method: "POST",
        body: JSON.stringify({ note: document.getElementById("count-note").value.trim() }),
      });
      try { state.catalog = await api("/catalog"); } catch (_) {}
      closeModal();
      render();
      toast("Count request sent for " + itemName + ".");
    } catch (e) {
      document.getElementById("count-error").textContent = e.message;
      button.disabled = false;
      button.textContent = "Send Request";
    }
  };
}

function openOrderEditor(orderId) {

      <div><label>City</label><input id="edit-city" value="${esc(p.shipping_city || "")}"></div>
      <div><label>State</label><select id="edit-state">${stateOptions(p.shipping_state || "")}</select></div>
      <div><label>ZIP code</label><input id="edit-zip" value="${esc(p.shipping_postal_code || "")}"></div>
      <div><label>UPS Ground transit</label><div id="edit-transit" class="computed-field">${p.shipping_state ? `${GROUND_DAYS_BY_STATE[p.shipping_state]} business day${GROUND_DAYS_BY_STATE[p.shipping_state] === 1 ? "" : "s"} · automatic` : "State pending"}</div></div>
      <div><label>Estimated attendees</label><input id="edit-attendees" type="number" min="0" step="1" value="${p.attendees == null ? "" : p.attendees}"></div>
    </div>
    <div style="margin-top:12px;"><label>Notes</label><textarea id="edit-notes">${esc(order.notes || "")}</textarea></div>
    <div style="margin-top:14px;"><label>Line quantities</label>${lineHtml}</div>
    <div id="edit-error" class="err-line" style="margin:8px 0 0;"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="edit-cancel">Cancel</button>

  document.getElementById("edit-state").onchange = (e) => {

    document.getElementById("edit-transit").textContent = days ? `${days} business day${days === 1 ? "" : "s"} · automatic` : "State pending";
  };
  document.getElementById("edit-save").onclick = async () => {
    const error = document.getElementById("edit-error");

        const qty = Number(input.value);
        if (!Number.isInteger(qty) || qty <= 0) throw new Error("Every quantity must be a whole number greater than zero.");
        const id = Number(input.dataset.itemId);
        const estimated = document.querySelector(`.edit-estimated[data-item-id="${id}"]`).checked;
        lines.push({ item_id: id, qty, estimated });
      });
      const attendeeText = document.getElementById("edit-attendees").value.trim();
      const attendees = attendeeText === "" ? null : Number(attendeeText);
      if (attendees != null && (!Number.isInteger(attendees) || attendees < 0)) throw new Error("Attendees must be a whole number.");
      const projectName = document.getElementById("edit-project-name").value.trim();
      if (!projectName) throw new Error("Enter a project or event name.");
      const button = document.getElementById("edit-save");
      button.disabled = true;
      button.textContent = "Saving…";
      await api(`/orders/${order.id}`, {
        method: "PUT",

          notes: document.getElementById("edit-notes").value.trim(),
          project: {
            name: projectName,
            owner: document.getElementById("edit-owner").value.trim(),
            event_date: document.getElementById("edit-event").value,

            shipping_address1: document.getElementById("edit-address1").value.trim(),
            shipping_address2: document.getElementById("edit-address2").value.trim(),
            shipping_city: document.getElementById("edit-city").value.trim(),
            shipping_state: document.getElementById("edit-state").value,
            shipping_postal_code: document.getElementById("edit-zip").value.trim(),
            attendees,
          },
          lines,
        }),
      });
      closeModal();
      toast("Order #" + order.id + " updated.");
      await loadMyOrders();
    } catch (e) {
      error.textContent = e.message;
      const button = document.getElementById("edit-save");
      if (button) { button.disabled = false; button.textContent = "Save Changes"; }
    }
  };

function cartLinesData() {

  }).filter(Boolean);
}

function cartLinesHtml(lines) {
  return lines.length ? lines.map(({ item, qty, estimated }) => `
    <div class="line">
      <div class="nm">${esc(item.name)}${estimated ? ` <span class="estimate-pill">EST.</span>` : ""}<span class="cd">${esc(item.code)}</span></div>

function selectedProjectForReadiness() {
  const f = state.orderForm;
  if (f.projectChoice.startsWith("saved:")) {
    return state.projects.find(p => p.id === Number(f.projectChoice.split(":", 2)[1])) || null;
  }
  return null;
}

function orderReadiness() {
  const f = state.orderForm;
  const lines = cartLinesData();
  const estimatedCount = lines.filter(line => line.estimated).length;
  const saved = selectedProjectForReadiness();
  let project = "Pending", eventDate = "Pending", address = "Pending", shipBy = "Pending";
  const issues = [];

  if (!lines.length) issues.push("Add at least one item.");
  if (f.projectChoice === "new") {
    project = f.projectName.trim() || "Pending";
    eventDate = f.eventDate || "Pending";
    const addressComplete = Boolean(f.shippingAddress1.trim() && f.shippingCity.trim() && f.shippingState && f.shippingPostalCode.trim());
    address = addressComplete ? "Complete" : "Address pending";
    const plan = shippingPlanForForm(f);
    shipBy = plan ? plan.shipByDate : "Pending";
    if (!f.projectName.trim()) issues.push("Project or event name is missing.");
    if (!f.eventDate) issues.push("Event date is missing.");
    if (!addressComplete) issues.push("Delivery address is incomplete.");
    if (!plan) issues.push("UPS Ground ship-by date is pending.");
  } else if (f.projectChoice === "none") {
    project = "No project";
    issues.push("Delivery address and event details will remain incomplete.");
  } else if (saved) {
    project = saved.name || "Saved project";
    const variable = saved.address_mode !== "fixed";
    eventDate = variable ? (f.eventDate || saved.event_date || "Pending") : (saved.event_date || "Pending");
    const addressComplete = variable
      ? Boolean(f.shippingAddress1.trim() && f.shippingCity.trim() && f.shippingState && f.shippingPostalCode.trim())
      : Boolean(saved.shipping_address1 && saved.shipping_city && saved.shipping_state && saved.shipping_postal_code);
    address = addressComplete ? "Complete" : "Address pending";
    const plan = variable ? shippingPlanForForm(Object.assign({}, f, {eventDate})) : null;
    shipBy = variable ? (plan ? plan.shipByDate : "Pending") : (saved.ship_by_date || "Pending");
    if (eventDate === "Pending") issues.push("Event date is missing.");
    if (!addressComplete) issues.push(variable ? "Enter this order's delivery address." : "Delivery address is incomplete in the saved project.");
    if (shipBy === "Pending") issues.push("UPS Ground ship-by date is pending.");
  } else {
    issues.push("Select a valid saved project.");
  }
  if (estimatedCount) issues.push(estimatedCount + " estimated quantit" + (estimatedCount === 1 ? "y needs" : "ies need") + " confirmation.");

  return {
    lines, estimatedCount, issues,
    rows: [
      ["Items", lines.length ? cartCount() + " units" : "None", lines.length ? "good" : "warn"],
      ["Project", project, project === "Pending" ? "warn" : "good"],
      ["Event", eventDate, eventDate === "Pending" ? "warn" : "good"],
      ["Address", address, address === "Complete" ? "good" : "warn"],
      ["Estimated qty", estimatedCount ? String(estimatedCount) : "None", estimatedCount ? "pending" : "good"],
      ["Ship by", shipBy, shipBy === "Pending" ? "warn" : "good"],
    ],
  };
}

          ${selectedSaved.ship_by_date ? `Ship by: ${esc(selectedSaved.ship_by_date)}<br>` : ""}
          ${selectedSaved.ups_ground_days ? `UPS Ground: ${selectedSaved.ups_ground_days} business day${selectedSaved.ups_ground_days === 1 ? "" : "s"}<br>` : ""}
          ${selectedSaved.address_mode === "fixed"
            ? (formattedAddress(selectedSaved) ? `Ship to: ${esc(formattedAddress(selectedSaved))}` : "No saved delivery address.")
            : `<span style="color:var(--safety)">Variable address · enter this order's destination below</span>`}
        </div>
        ${selectedSaved.address_mode !== "fixed" ? `<div class="project-builder">
          <div class="two-col"><div><label class="mini-label" for="project-event-date">Event date</label><input id="project-event-date" type="date" value="${esc(f.eventDate || selectedSaved.event_date || "")}"></div><div><label class="mini-label" for="project-location">Event venue / location</label><input id="project-location" type="text" value="${esc(f.projectLocation || selectedSaved.location || "")}"></div></div>
          <div class="address-box"><h3>Delivery address for this order</h3>
            <div><label class="mini-label" for="shipping-address1">Street address</label><input id="shipping-address1" value="${esc(f.shippingAddress1)}"></div>
            <div style="margin-top:8px"><label class="mini-label" for="shipping-address2">Suite / floor / attention</label><input id="shipping-address2" value="${esc(f.shippingAddress2)}"></div>
            <div class="two-col" style="margin-top:8px"><div><label class="mini-label" for="shipping-city">City</label><input id="shipping-city" value="${esc(f.shippingCity)}"></div><div><label class="mini-label" for="shipping-state">State</label><select id="shipping-state">${stateOptions(f.shippingState)}</select></div></div>
            <div class="two-col" style="margin-top:8px"><div><label class="mini-label" for="shipping-postal-code">ZIP code</label><input id="shipping-postal-code" value="${esc(f.shippingPostalCode)}"></div><div><label class="mini-label">UPS Ground transit</label><div class="computed-field">${f.shippingState ? `${GROUND_DAYS_BY_STATE[f.shippingState]} business day${GROUND_DAYS_BY_STATE[f.shippingState] === 1 ? "" : "s"} · automatic` : "Select a state to calculate"}</div></div></div>
          </div>
        </div>` : ""}
        ` : `<div class="project-help">This order will be added to the selected saved project.</div>`}
      ${renderOrderReadinessBox()}
      <textarea id="slip-notes" placeholder="Notes for the approver (optional)">${esc(f.notes)}</textarea>
      <button class="btn-primary" id="submit-order" ${!lines.length ? "disabled" : ""}>Submit Order</button>
    </div>
  </div>`;
}

function render() {
  const app = document.getElementById("app");
  if (!state.token) {
    app.innerHTML = renderLogin();
    wireLogin();
    return;
  }
  const searchHadFocus = document.activeElement && document.activeElement.id === "search";
  const searchCursorPos = searchHadFocus ? document.activeElement.selectionStart : null;
  const top = `<div class="top-shell">
    <header class="bar">
      <div class="brand"><span class="crate">📦</span> Oti-Warehouse Swag <span class="build-badge">v${APP_VERSION} WORKFLOW</span></div>
      <div class="who">
        <span>${esc(state.user ? state.user.full_name || state.user.username : "")}</span>
        ${state.user && state.user.roles.length ? `<span class="roles">${state.user.roles.join(", ").toUpperCase()}</span>` : ""}
        <select class="theme-select" id="theme-select" aria-label="Theme">
          <option value="warehouse-dark" ${state.theme === "warehouse-dark" ? "selected" : ""}>Warehouse Dark</option>
          <option value="light" ${state.theme === "light" ? "selected" : ""}>Light</option>
          <option value="high-contrast" ${state.theme === "high-contrast" ? "selected" : ""}>High Contrast</option>
          <option value="system" ${state.theme === "system" ? "selected" : ""}>System</option>
        </select>
        <button class="link" id="logout-btn">Log out</button>
      </div>
    </header>
    <nav class="tabs">
      <button data-tab="catalog" class="${state.tab === "catalog" ? "active" : ""}">1. Catalog</button>
      <button data-tab="setup" class="${state.tab === "setup" ? "active" : ""}">2. Project & Delivery (${cartCount()})</button>
      <button data-tab="orders" class="${state.tab === "orders" ? "active" : ""}">My Orders</button>
    </nav>
  </div>`;

  if (state.tab === "catalog") {
    app.innerHTML = `${top}
      <div class="filter-backdrop ${state.filterDrawerOpen ? "open" : ""}" id="filter-backdrop"></div>
      <main class="catalog-shell ${state.filterCollapsed ? "filters-collapsed" : ""}">
        <aside class="filter-rail ${state.filterDrawerOpen ? "open" : ""} ${state.filterCollapsed ? "collapsed" : ""}">${renderFilterRail()}</aside>
        <section class="catalog-content view-panel">${renderCatalogTab()}</section>
        <aside class="cart-rail">${renderCompactCart()}</aside>
      </main>
      <button class="mobile-cart-bar" id="mobile-cart-open" type="button"><span>Review Order</span><span class="cart-total">${cartCount()} units</span></button>`;
  } else {
    app.innerHTML = `${top}<main class="single-shell ${state.tab === "setup" ? "setup-mode" : ""}"><section class="view-panel">${state.tab === "setup" ? renderSlip() : renderOrdersTab()}</section></main>`;
  }
  wireApp(searchHadFocus, searchCursorPos);
}

// ---- event wiring ---------------------------------------------------------------
function wireLogin() {
  document.getElementById("login-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const button = e.target.querySelector('button[type="submit"]');
    button.disabled = true;
    button.innerHTML = '<span class="spinner" style="width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:7px"></span>Signing in';
    const fd = new FormData(e.target);
    doLogin(fd.get("username"), fd.get("password"));
  });
  document.getElementById("toggle-server").addEventListener("click", () => {
    state.showServerField = !state.showServerField;
    render();
  });
  const serverField = document.getElementById("f-server");
  if (serverField) {
    serverField.addEventListener("change", (e) => {
      state.apiBase = e.target.value.trim().replace(/\/$/, "") || DEFAULT_API_BASE;
    });
  }
}

function wireApp(searchHadFocus, searchCursorPos) {
  document.getElementById("logout-btn").addEventListener("click", () => logout());
  const themeSelect = document.getElementById("theme-select");
  if (themeSelect) themeSelect.addEventListener("change", async (e) => {
    const previous = state.theme;
    applyTheme(e.target.value);
    if (state.user) state.user.theme = state.theme;
    try { await api("/me/preferences", {method:"PUT", body:JSON.stringify({theme:state.theme})}); }
    catch (err) { applyTheme(previous); toast(err.message, true); }
  });

  document.querySelectorAll("nav.tabs button").forEach(btn => {
    btn.addEventListener("click", () => {
      state.tab = btn.dataset.tab;
      state.filterDrawerOpen = false;
      renderWithTransition();
      if (state.tab === "orders") loadMyOrders();
    });
  });

  const goToSetup = () => {
    state.tab = "setup";
    state.filterDrawerOpen = false;
    renderWithTransition();
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  ["open-order-setup", "compact-open-setup", "mobile-cart-open"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("click", goToSetup);
  });

  const mobileFilterOpen = document.getElementById("mobile-filter-open");
  if (mobileFilterOpen) mobileFilterOpen.addEventListener("click", () => { state.filterDrawerOpen = true; render(); });
  const filterClose = document.getElementById("filter-close");
  if (filterClose) filterClose.addEventListener("click", () => { state.filterDrawerOpen = false; render(); });
  const backdrop = document.getElementById("filter-backdrop");
  if (backdrop) backdrop.addEventListener("click", () => { state.filterDrawerOpen = false; render(); });
  const filterCollapse = document.getElementById("filter-collapse");
  if (filterCollapse) filterCollapse.addEventListener("click", () => {
    if (window.matchMedia("(max-width: 920px)").matches) {
      state.filterDrawerOpen = false;
    } else {
      state.filterCollapsed = !state.filterCollapsed;
      localStorage.setItem("oti_filter_collapsed", state.filterCollapsed ? "1" : "0");
    }
    render();
  });
  document.querySelectorAll("[data-quick-filter]").forEach(btn => btn.addEventListener("click", () => {
    state.quickFilter = btn.dataset.quickFilter;
    state.filterDrawerOpen = false;
    render();
  }));
  document.querySelectorAll("[data-category-choice]").forEach(btn => btn.addEventListener("click", () => {
    state.category = btn.dataset.categoryChoice || "";
    state.filterDrawerOpen = false;
    render();
  }));
  const clearFilters = document.getElementById("clear-filters");
  if (clearFilters) clearFilters.addEventListener("click", () => {
    state.category = "";
    state.quickFilter = "all";
    render();
  });

  const searchEl = document.getElementById("search");
  if (searchEl) {
    searchEl.addEventListener("input", (e) => { state.search = e.target.value; render(); });
    if (searchHadFocus) {
      searchEl.focus();
      searchEl.selectionStart = searchEl.selectionEnd = searchCursorPos ?? searchEl.value.length;
    }
  }
  const sortEl = document.getElementById("sort-by");
  if (sortEl) sortEl.addEventListener("change", (e) => { state.sort = e.target.value; render(); });

  document.querySelectorAll(".stepper button").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = Number(btn.dataset.id);
      const item = state.catalog.find(i => i.id === id);
      if (!item) return;
      const cur = draftQtyFor(item);
      const max = Number(btn.dataset.max || 999999);
      setDraftQty(id, btn.dataset.act === "inc" ? cur + 1 : cur - 1, max);
    });
  });

  document.querySelectorAll(".qty-input").forEach(input => {
    const syncDraft = () => {
      const id = Number(input.dataset.qtyId);
      const max = Number(input.dataset.max || 0);
      let requested = input.value === "" ? 0 : Number(input.value);
      if (!Number.isFinite(requested) || requested < 0) requested = 0;
      requested = Math.floor(requested);
      if (requested > max) {
        requested = max;
        toast("Only " + max + " are currently available.", true);
      }
      state.draftQty[id] = requested;
      input.value = requested === 0 ? "" : String(requested);
      if (requested <= 0) state.draftEstimated[id] = false;
      const stepper = input.closest(".stepper");
      if (stepper) {
        const dec = stepper.querySelector('[data-act="dec"]');
        const inc = stepper.querySelector('[data-act="inc"]');
        if (dec) dec.disabled = requested <= 0;
        if (inc) inc.disabled = requested >= max;
      }
      const estimate = document.querySelector(`.estimated-toggle[data-estimated-id="${id}"]`);
      if (estimate) {
        estimate.disabled = requested <= 0;
        if (requested <= 0) estimate.checked = false;
      }
      const add = document.querySelector(`[data-add-cart="${id}"]`);
      if (add) {
        add.disabled = requested <= 0;
        const inCart = Number(state.cart[id] || 0);
        const same = inCart > 0 && requested === inCart && draftEstimatedFor(id) === Boolean(state.estimated[id]);
        add.textContent = inCart ? (same ? "In Cart" : "Update Cart") : "Add to Cart";
        add.classList.toggle("in-cart", same);
      }
    };
    input.addEventListener("input", syncDraft);
    input.addEventListener("blur", syncDraft);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); input.blur(); }
    });
  });

  document.querySelectorAll(".estimated-toggle").forEach(toggle => {
    toggle.addEventListener("change", () => {
      const id = Number(toggle.dataset.estimatedId);
      const item = state.catalog.find(i => i.id === id);
      if (!item || draftQtyFor(item) <= 0) {
        toggle.checked = false;
        toggle.disabled = true;
        state.draftEstimated[id] = false;
      } else {
        state.draftEstimated[id] = toggle.checked;
      }
      const add = document.querySelector(`[data-add-cart="${id}"]`);
      if (add) {
        const inCart = Number(state.cart[id] || 0);
        const same = inCart > 0 && draftQtyFor(item) === inCart && draftEstimatedFor(id) === Boolean(state.estimated[id]);
        add.textContent = inCart ? (same ? "In Cart" : "Update Cart") : "Add to Cart";
        add.classList.toggle("in-cart", same);
      }
    });
  });

  document.querySelectorAll("[data-add-cart]").forEach(btn => {
    btn.addEventListener("click", () => commitItemToCart(Number(btn.dataset.addCart)));
  });

  document.querySelectorAll("[data-favorite-id]").forEach(btn => {
    btn.addEventListener("click", async (event) => {
      event.stopPropagation();
      const id = Number(btn.dataset.favoriteId);
      const item = state.catalog.find(i => i.id === id);
      if (!item) return;
      const next = !item.favorite;
      item.favorite = next;
      render();
      try {
        await api(`/catalog/${id}/favorite`, {method: next ? "POST" : "DELETE"});
        toast(next ? "Added to favorites." : "Removed from favorites.");
      } catch (err) {
        item.favorite = !next;
        render();
        toast(err.message, true);
      }
    });
  });

  document.querySelectorAll(".request-count").forEach(btn => {
    btn.addEventListener("click", () => submitCountRequest(Number(btn.dataset.countId), btn.dataset.countName || "this item"));
  });

  document.querySelectorAll("[data-lightbox-src], [data-proof-id]").forEach(img => {
    img.addEventListener("click", () => {
      if (img.dataset.itemImageId) markRecentlyViewed(Number(img.dataset.itemImageId));
      if (img.dataset.lightboxSrc) openLightbox(img.dataset.lightboxSrc, img.alt);
    });
  });
  loadProtectedProofImages();

  document.querySelectorAll(".edit-order").forEach(btn => {
    btn.addEventListener("click", () => openOrderEditor(Number(btn.dataset.orderId)));
  });

  wireRemoveButtons();

  const bindFormValue = (id, key, eventName = "input") => {
    const el = document.getElementById(id);
    if (el) el.addEventListener(eventName, (e) => { state.orderForm[key] = e.target.value; });
  };
  const projectChoice = document.getElementById("project-choice");
  if (projectChoice) projectChoice.addEventListener("change", (e) => {
    state.orderForm.projectChoice = e.target.value;
    if (e.target.value.startsWith("saved:")) {
      const saved = state.projects.find(p => p.id === Number(e.target.value.split(":", 2)[1]));
      if (saved && saved.address_mode !== "fixed") {
        state.orderForm.eventDate = saved.event_date || "";
        state.orderForm.projectLocation = saved.location || "";
        state.orderForm.shippingAddress1 = "";
        state.orderForm.shippingAddress2 = "";
        state.orderForm.shippingCity = "";
        state.orderForm.shippingState = "";
        state.orderForm.shippingPostalCode = "";
      }
    }
    renderWithTransition();
  });
  bindFormValue("project-name", "projectName");
  bindFormValue("project-owner", "projectOwner");
  const eventDate = document.getElementById("project-event-date");
  if (eventDate) eventDate.addEventListener("change", (e) => { state.orderForm.eventDate = e.target.value; render(); });
  bindFormValue("project-location", "projectLocation");
  bindFormValue("shipping-address1", "shippingAddress1");
  bindFormValue("shipping-address2", "shippingAddress2");
  bindFormValue("shipping-city", "shippingCity");
  bindFormValue("shipping-postal-code", "shippingPostalCode");
  const shippingState = document.getElementById("shipping-state");
  if (shippingState) shippingState.addEventListener("change", (e) => { state.orderForm.shippingState = e.target.value; render(); });
  bindFormValue("project-attendees", "attendees");
  bindFormValue("project-description", "projectDescription");
  bindFormValue("slip-notes", "notes");
  const saveProject = document.getElementById("save-project");
  if (saveProject) saveProject.addEventListener("change", (e) => { state.orderForm.saveProject = e.target.checked; });

  const submitBtn = document.getElementById("submit-order");
  if (submitBtn) submitBtn.addEventListener("click", submitOrder);
}

// ---- boot -------------------------------------------------------------------
(async function boot() {
  const lightbox = document.getElementById("lightbox");
  lightbox.querySelector(".lightbox-close").addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", (e) => { if (e.target === lightbox) closeLightbox(); });
  const modalRoot = document.getElementById("modal-root");
  modalRoot.addEventListener("click", (e) => { if (e.target === modalRoot) closeModal(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (lightbox.classList.contains("open")) closeLightbox();
      else if (modalRoot.classList.contains("open")) closeModal();
    }
  });
  if (state.token) {
    try {
      state.user = await api("/me");
      applyTheme(state.user.theme || state.theme);
      state.orderForm = blankOrderForm();
      await Promise.all([loadCatalog(), loadMyOrders()]);
      pollLoop();
    } catch (e) {
      // logout() already called by api() on 401; other errors just show login
    }
  }
  render();
})();
</script>
</body>
</html>
