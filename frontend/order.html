  if (panel && !e.target.closest("#notification-panel") && !e.target.closest("#notification-bell")) panel.remove();
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (state.cartDrawerOpen) { state.cartDrawerOpen = false; render(); }
  if (state.profileMenuOpen) { state.profileMenuOpen = false; document.getElementById("profile-menu")?.classList.remove("open"); }
});
// The Folder Builder reports catalog changes (new items / saved kits).
window.addEventListener("message", async (e) => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.type === "oti-catalog-changed") {
    try { const [items, kits] = await Promise.all([api("/catalog"), api("/catalog-kits").catch(() => state.kits)]); state.catalog = items; state.kits = kits; } catch (_) {}
    if (e.data.toast) toast(e.data.toast);
    if (e.data.goTo) { state.tab = e.data.goTo; render(); }
  } else if (e.data.type === "oti-add-kit-to-order") {
    try { state.kits = await api("/catalog-kits"); } catch (_) {}
    const kit = state.kits.find(k => Number(k.id) === Number(e.data.kitId));
    if (kit && Number(kit.buildable_quantity || 0) > 0) { state.kitCart[kit.id] = Math.min(Number(kit.buildable_quantity), Number(e.data.qty || 1)); state.kitDraftQty[kit.id] = state.kitCart[kit.id]; saveCartDraft(); toast(`${kit.name} added to your order.`); render(); }
    else toast("That folder kit can't be ordered yet (an item may still be waiting for review or out of stock).", true);
  } else if (e.data.type === "oti-request-theme") {
    broadcastTheme();
  }
});


// ---- event wiring ---------------------------------------------------------------
function wireLogin() {
  document.getElementById("login-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const button = e.target.querySelector('button[type="submit"]');
    button.disabled = true;
    button.innerHTML = '<span class="spinner" style="width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:7px"></span>Signing in';
    const fd = new FormData(e.target);
    doLogin(fd.get("username"), fd.get("password"));
  });
  document.getElementById("toggle-server").addEventListener("click", () => {
    state.showServerField = !state.showServerField;
    render();
  });
  const serverField = document.getElementById("f-server");
  if (serverField) {
    serverField.addEventListener("change", (e) => {
      state.apiBase = e.target.value.trim().replace(/\/$/, "") || DEFAULT_API_BASE;
    });
  }
}

function wireApp(searchHadFocus, searchCursorPos) {
  document.getElementById("logout-btn").addEventListener("click", () => logout());
  const themeSelect = document.getElementById("theme-select");
  if (themeSelect) themeSelect.addEventListener("change", async (e) => {
    const previous = state.theme;
    applyTheme(e.target.value);
    if (state.user) state.user.theme = state.theme;
    try { await api("/me/preferences", {method:"PUT", body:JSON.stringify({theme:state.theme})}); }
    catch (err) { applyTheme(previous); toast(err.message, true); }
  });

  const folderFrame=document.getElementById("folder-builder-frame");
  if(folderFrame) folderFrame.addEventListener("load",()=>folderFrame.contentWindow?.postMessage({type:"oti-folder-init",catalog:state.catalog,token:state.token,apiBase:state.apiBase},location.origin));


  const goToSetup = () => {
    state.tab = "setup";
    state.filterDrawerOpen = false;
    renderWithTransition();
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  ["open-order-setup", "mobile-cart-open"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("click", goToSetup);
  });

  const mobileFilterOpen = document.getElementById("mobile-filter-open");
  if (mobileFilterOpen) mobileFilterOpen.addEventListener("click", () => { state.filterDrawerOpen = true; render(); });
  const filterClose = document.getElementById("filter-close");
  if (filterClose) filterClose.addEventListener("click", () => { state.filterDrawerOpen = false; render(); });
  const backdrop = document.getElementById("filter-backdrop");
  if (backdrop) backdrop.addEventListener("click", () => { state.filterDrawerOpen = false; render(); });
  const filterCollapse = document.getElementById("filter-collapse");
  if (filterCollapse) filterCollapse.addEventListener("click", () => {
    if (window.matchMedia("(max-width: 980px)").matches) {
      state.filterDrawerOpen = false;
    } else {
      state.filterCollapsed = !state.filterCollapsed;
      localStorage.setItem("oti_filter_collapsed", state.filterCollapsed ? "1" : "0");
    }
    render();
  });
  document.querySelectorAll("[data-quick-filter]").forEach(btn => btn.addEventListener("click", () => {
    state.quickFilter = btn.dataset.quickFilter;
    state.filterDrawerOpen = false;
    render();
  }));
  document.querySelectorAll("[data-category-choice]").forEach(btn => btn.addEventListener("click", () => {
    state.category = btn.dataset.categoryChoice || "";
    state.filterDrawerOpen = false;
    render();
  }));
  document.querySelectorAll("[data-brand-choice]").forEach(btn=>btn.addEventListener("click",()=>{state.brand=btn.dataset.brandChoice||"";state.filterDrawerOpen=false;render();}));
  const clearFilters = document.getElementById("clear-filters");
  if (clearFilters) clearFilters.addEventListener("click", () => {
    state.category = ""; state.brand = "";
    state.quickFilter = "all";
    render();
  });

  const brandTop = document.getElementById("brand-top");
  if (brandTop) brandTop.addEventListener("change", (e) => { state.brand = e.target.value || ""; render(); });

  const searchEl = document.getElementById("search");
  if (searchEl) {
    searchEl.addEventListener("input", (e) => { state.search = e.target.value; render(); });
    if (searchHadFocus) {
      searchEl.focus();
      searchEl.selectionStart = searchEl.selectionEnd = searchCursorPos ?? searchEl.value.length;
    }
  }
  const sortEl = document.getElementById("sort-by");
  if (sortEl) sortEl.addEventListener("change", (e) => { state.sort = e.target.value; render(); });

  document.querySelectorAll(".stepper button").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = Number(btn.dataset.id);
      const item = state.catalog.find(i => i.id === id);
      if (!item) return;
      const cur = draftQtyFor(item);
      const max = Number(btn.dataset.max || 999999);
      setDraftQty(id, btn.dataset.act === "inc" ? cur + 1 : cur - 1, max);
    });
  });

  document.querySelectorAll(".qty-input").forEach(input => {
    const syncDraft = () => {
      const id = Number(input.dataset.qtyId);
      const max = Number(input.dataset.max || 0);
      let requested = input.value === "" ? 0 : Number(input.value);
      if (!Number.isFinite(requested) || requested < 0) requested = 0;
      requested = Math.floor(requested);
      if (requested > max) {
        requested = max;
        toast("Only " + max + " are currently available.", true);
      }
      state.draftQty[id] = requested;
      input.value = requested === 0 ? "" : String(requested);
      if (requested <= 0) state.draftEstimated[id] = false;
      const stepper = input.closest(".stepper");
      if (stepper) {
        const dec = stepper.querySelector('[data-act="dec"]');
        const inc = stepper.querySelector('[data-act="inc"]');
        if (dec) dec.disabled = requested <= 0;
        if (inc) inc.disabled = requested >= max;
      }
      const estimate = document.querySelector(`.estimated-toggle[data-estimated-id="${id}"]`);
      if (estimate) {
        estimate.disabled = requested <= 0;
        if (requested <= 0) estimate.checked = false;
      }
      const add = document.querySelector(`[data-add-cart="${id}"]`);
      if (add) {
        add.disabled = requested <= 0;
        const inCart = Number(state.cart[id] || 0);
        const same = inCart > 0 && requested === inCart && draftEstimatedFor(id) === Boolean(state.estimated[id]);
        add.textContent = inCart ? (same ? "In order" : "Update order") : "Add to order";
        add.classList.toggle("in-cart", same);
      }
    };
    input.addEventListener("input", syncDraft);
    input.addEventListener("blur", syncDraft);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); input.blur(); }
    });
  });

  document.querySelectorAll(".estimated-toggle").forEach(toggle => {
    toggle.addEventListener("change", () => {
      const id = Number(toggle.dataset.estimatedId);
      const item = state.catalog.find(i => i.id === id);
      if (!item || draftQtyFor(item) <= 0) {
        toggle.checked = false;
        toggle.disabled = true;
        state.draftEstimated[id] = false;
      } else {
        state.draftEstimated[id] = toggle.checked;
      }
      const add = document.querySelector(`[data-add-cart="${id}"]`);
      if (add) {
        const inCart = Number(state.cart[id] || 0);
        const same = inCart > 0 && draftQtyFor(item) === inCart && draftEstimatedFor(id) === Boolean(state.estimated[id]);
        add.textContent = inCart ? (same ? "In order" : "Update order") : "Add to order";
        add.classList.toggle("in-cart", same);
      }
    });
  });

  document.querySelectorAll("[data-add-cart]").forEach(btn => {
    btn.addEventListener("click", () => reviewNavCountBeforeCart(Number(btn.dataset.addCart)));
  });

  document.querySelectorAll("[data-favorite-id]").forEach(btn => {
    btn.addEventListener("click", async (event) => {
      event.stopPropagation();
      const id = Number(btn.dataset.favoriteId);
      const item = state.catalog.find(i => i.id === id);
      if (!item) return;
      const next = !item.favorite;
      item.favorite = next;
      render();
      try {
        await api(`/catalog/${id}/favorite`, {method: next ? "POST" : "DELETE"});
        toast(next ? "Added to favorites." : "Removed from favorites.");
      } catch (err) {
        item.favorite = !next;
        render();
        toast(err.message, true);
      }
    });
  });

  document.querySelectorAll(".request-count").forEach(btn => {
    btn.addEventListener("click", () => submitCountRequest(Number(btn.dataset.countId), btn.dataset.countName || "this item"));
  });


  document.getElementById("notification-bell")?.addEventListener("click",showNotifications);
  document.querySelectorAll("[data-collaborator-id]").forEach(cb=>cb.addEventListener("change",()=>{state.orderForm.collaboratorUserIds=[...document.querySelectorAll("[data-collaborator-id]:checked")].map(x=>Number(x.dataset.collaboratorId));saveCartDraft();}));
  document.getElementById("catalog-type")?.addEventListener("change",e=>{state.catalogType=e.target.value;render();});
  document.querySelectorAll(".cancel-order").forEach(btn=>btn.addEventListener("click",()=>{const id=Number(btn.dataset.orderId),o=state.myOrders.find(x=>x.id===id);openModal(`<div class="modal-head"><h2>Cancel ${esc(o?.order_number||"order")}</h2><button class="modal-x" id="modal-x">×</button></div><p>This keeps the order in history with a Cancelled status. If it was already approved, reserved inventory will be returned.</p><div id="cancel-order-error" class="err-line"></div><div class="modal-actions"><button class="btn-secondary" id="cancel-order-no">Keep Order</button><button class="btn-primary" id="cancel-order-yes">Cancel Order</button></div>`);document.getElementById("modal-x").onclick=closeModal;document.getElementById("cancel-order-no").onclick=closeModal;document.getElementById("cancel-order-yes").onclick=async()=>{const b=document.getElementById("cancel-order-yes");b.disabled=true;b.textContent="Cancelling…";try{await api(`/orders/${id}/cancel`,{method:"POST"});closeModal();toast("Order cancelled.");await loadMyOrders();}catch(e){document.getElementById("cancel-order-error").textContent=e.message;b.disabled=false;b.textContent="Cancel Order";}};}));

  document.querySelectorAll("[data-variant-select]").forEach(sel=>sel.addEventListener("change",()=>{const id=Number(sel.dataset.variantSelect);state.selectedVariants[id]=Number(sel.value);state.draftQty[id]=0;state.draftEstimated[id]=false;saveCartDraft();render();}));
  const requestDialog=(type)=>{const isUser=type==="new_user",label=isUser?"Request New User":"Request New Item",titleLabel=isUser?"User name / request title":"Item name / request title";openModal(`<div class="modal-head"><h2>${label}</h2><button class="modal-x" id="modal-x">×</button></div><div class="field"><label>${titleLabel} *</label><input id="portal-request-title" maxlength="200" autofocus></div><div class="field"><label>Details / notes</label><textarea id="portal-request-details" rows="5" maxlength="2000"></textarea></div><div class="err-line" id="portal-request-error"></div><button class="btn-primary" id="portal-request-send">Submit Request</button>`);document.getElementById("modal-x").onclick=closeModal;document.getElementById("portal-request-send").onclick=async()=>{const title=document.getElementById("portal-request-title").value.trim(),details=document.getElementById("portal-request-details").value.trim(),err=document.getElementById("portal-request-error");if(!title){err.textContent="Enter a name or short title for this request.";return;}err.textContent="";try{await api(`/admin-requests/${type}`,{method:"POST",body:JSON.stringify({title,details})});closeModal();toast(label+" sent.");}catch(e){err.textContent=e.message;}}};
  document.getElementById("request-new-user")?.addEventListener("click",()=>requestDialog("new_user"));
  document.getElementById("request-new-item")?.addEventListener("click",()=>requestDialog("new_item"));
  document.getElementById("request-history")?.addEventListener("click",async()=>{try{const rows=await api("/admin-requests");openModal(`<div class="modal-head"><h2>Admin Requests</h2><button class="modal-x" id="modal-x">×</button></div><div class="request-history">${rows.length?rows.map(r=>`<div class="request-history-row"><b>${r.request_type==="new_user"?"New User":"New Item"} · ${esc(r.title)}</b><div>${esc(r.details||"")}</div><small>${esc(r.status)} · ${new Date(r.created_at).toLocaleString()}</small></div>`).join(""):`<div class="empty">No requests yet.</div>`}</div>`);document.getElementById("modal-x").onclick=closeModal;}catch(e){toast(e.message,true);}});
  document.querySelectorAll("[data-kit-act]").forEach(btn=>btn.addEventListener("click",()=>{const id=Number(btn.dataset.kitId),k=state.kits.find(x=>x.id===id),max=Number(k?.buildable_quantity||0),cur=Number(state.kitDraftQty[id]??state.kitCart[id]??0);state.kitDraftQty[id]=Math.max(0,Math.min(max,cur+(btn.dataset.kitAct==="inc"?1:-1)));render();}));
  document.querySelectorAll("[data-kit-qty]").forEach(inp=>inp.addEventListener("input",()=>{const id=Number(inp.dataset.kitQty),k=state.kits.find(x=>x.id===id),max=Number(k?.buildable_quantity||0);state.kitDraftQty[id]=Math.max(0,Math.min(max,Number(inp.value||0)));}));
  document.querySelectorAll("[data-add-kit]").forEach(btn=>btn.addEventListener("click",()=>{const id=Number(btn.dataset.addKit),k=state.kits.find(x=>x.id===id);if(!k)return;const q=Math.max(0,Math.min(Number(k.buildable_quantity||0),Number(state.kitDraftQty[id]??state.kitCart[id]??0)));if(q<1)return;state.kitCart[id]=q;state.kitDraftQty[id]=q;saveCartDraft();toast(k.name+" added to your order.");render();}));
  document.querySelectorAll("[data-folder-add]").forEach(btn=>btn.addEventListener("click",()=>{const id=Number(btn.dataset.folderAdd);const qty=Math.max(1,Number(currentDraftQty(state.catalog.find(x=>x.id===id))||1));state.folderComponents.push({item_id:id,qty});render();}));
  document.querySelectorAll("[data-folder-up]").forEach(b=>b.onclick=()=>{const i=Number(b.dataset.folderUp);if(i>0)[state.folderComponents[i-1],state.folderComponents[i]]=[state.folderComponents[i],state.folderComponents[i-1]];render();});
  document.querySelectorAll("[data-folder-down]").forEach(b=>b.onclick=()=>{const i=Number(b.dataset.folderDown);if(i<state.folderComponents.length-1)[state.folderComponents[i+1],state.folderComponents[i]]=[state.folderComponents[i],state.folderComponents[i+1]];render();});
  document.querySelectorAll("[data-folder-remove]").forEach(b=>b.onclick=()=>{state.folderComponents.splice(Number(b.dataset.folderRemove),1);render();});
  document.getElementById("folder-to-cart")?.addEventListener("click",()=>{state.folderComponents.forEach(c=>{state.cart[c.item_id]=(Number(state.cart[c.item_id]||0)+Number(c.qty));state.draftQty[c.item_id]=state.cart[c.item_id];});const seq=state.folderComponents.map((c,i)=>{const it=state.catalog.find(x=>x.id===c.item_id);return `${i+1}. ${c.qty} x ${it?.code||c.item_id} - ${it?.name||"Item"}`;}).join(" | ");state.orderForm.notes=((state.orderForm.notes||"")+`\nFOLDER BUILD ORDER: ${seq}`).trim();saveCartDraft();toast("Folder components added in the selected sequence.");render();});

  document.querySelectorAll("[data-lightbox-src], [data-proof-id]").forEach(img => {
    img.addEventListener("click", () => {
      if (img.dataset.itemImageId) markRecentlyViewed(Number(img.dataset.itemImageId));
      if (img.dataset.lightboxSrc) openLightbox(img.dataset.lightboxSrc,img.alt,(img.dataset.gallery||"").split("|").filter(Boolean));
    });
  });
  loadProtectedProofImages();

  document.querySelectorAll(".edit-order").forEach(btn => {
    btn.addEventListener("click", () => openOrderEditor(Number(btn.dataset.orderId)));
  });

  wireRemoveButtons();

  const bindFormValue = (id, key, eventName = "input") => {
    const el = document.getElementById(id);
    if (el) el.addEventListener(eventName, (e) => { state.orderForm[key] = e.target.value; refreshReadinessUI(); });
  };
  const projectChoice = document.getElementById("project-choice");
  if (projectChoice) projectChoice.addEventListener("change", (e) => {
    state.orderForm.projectChoice = e.target.value;
    if (e.target.value.startsWith("saved:")) {
      const saved = state.projects.find(p => p.id === Number(e.target.value.split(":", 2)[1]));
      if (saved && saved.address_mode !== "fixed") {
        state.orderForm.eventDate = saved.event_date || "";
        state.orderForm.projectLocation = saved.location || "";
        state.orderForm.shippingAddress1 = "";
        state.orderForm.shippingAddress2 = "";
        state.orderForm.shippingAttention = "";
        state.orderForm.shippingCity = "";
        state.orderForm.shippingState = "";
        state.orderForm.shippingPostalCode = "";
      }
    }
    renderWithTransition();
  });
  bindFormValue("project-name", "projectName");
  bindFormValue("project-owner", "projectOwner");
  const eventDate = document.getElementById("project-event-date");
  if (eventDate) eventDate.addEventListener("change", (e) => { syncOrderFormFromDom(); state.orderForm.eventDate = e.target.value; render(); });
  bindFormValue("project-location", "projectLocation");
  bindFormValue("shipping-address1", "shippingAddress1");
  bindFormValue("shipping-address2", "shippingAddress2");
  bindFormValue("shipping-attention", "shippingAttention");
  bindFormValue("shipping-city", "shippingCity");
  bindFormValue("shipping-postal-code", "shippingPostalCode");
  const shippingState = document.getElementById("shipping-state");
  if (shippingState) shippingState.addEventListener("change", (e) => { syncOrderFormFromDom(); state.orderForm.shippingState = e.target.value; render(); });
  bindFormValue("project-attendees", "attendees");
  bindFormValue("project-description", "projectDescription");
  bindFormValue("slip-notes", "notes");
  const saveProject = document.getElementById("save-project");
  if (saveProject) saveProject.addEventListener("change", (e) => { state.orderForm.saveProject = e.target.checked; });


  const attendeeInput=document.getElementById("attendee-file");
  if(attendeeInput) attendeeInput.addEventListener("change",async e=>{const file=e.target.files?.[0];if(!file)return;try{const fd=new FormData();fd.append("file",file);state.attendeePreview=await api("/attendee-lists/preview",{method:"POST",body:fd});state.attendeeFile=file;render();}catch(err){toast(err.message,true);}});
  document.getElementById("remove-attendee-list")?.addEventListener("click",()=>{state.attendeeFile=null;state.attendeePreview=null;render();});

  const submitBtn = document.getElementById("submit-order");
  if (submitBtn) submitBtn.addEventListener("click", submitOrder);
}

window.addEventListener("message",async e=>{if(!e.data||e.data.type!=="oti-save-folder-kit")return;try{const payload=e.data.payload||{};const saved=await api("/folder-kits",{method:"POST",body:JSON.stringify(payload)});if(payload.preview_data_url){const res=await fetch(payload.preview_data_url);const blob=await res.blob();const fd=new FormData();fd.append("file",blob,"folder-kit.png");await api(`/folder-kits/${saved.id}/image`,{method:"POST",body:fd});}toast(`${saved.name} saved to the catalog.`);await loadCatalog();state.tab="catalog";render();}catch(err){toast(err.message,true);}});

// ---- boot -------------------------------------------------------------------
(async function boot() {
  const lightbox = document.getElementById("lightbox");
  lightbox.querySelector(".lightbox-close").addEventListener("click", closeLightbox);
  lightbox.querySelector(".lightbox-prev").addEventListener("click",e=>{e.stopPropagation();lightboxIndex=(lightboxIndex-1+lightboxGallery.length)%lightboxGallery.length;showLightboxImage();});
  lightbox.querySelector(".lightbox-next").addEventListener("click",e=>{e.stopPropagation();lightboxIndex=(lightboxIndex+1)%lightboxGallery.length;showLightboxImage();});
  lightbox.addEventListener("click", (e) => { if (e.target === lightbox) closeLightbox(); });
  const modalRoot = document.getElementById("modal-root");
  modalRoot.addEventListener("click", (e) => { if (e.target === modalRoot) closeModal(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (lightbox.classList.contains("open")) closeLightbox();
      else if (modalRoot.classList.contains("open")) closeModal();
    }
  });
  if (state.token) {
    try {
      state.user = await api("/me");
      applyTheme(state.user.theme || state.theme);
      if (state.user.accent_color) applyAccent(state.user.accent_color);
      state.orderForm = blankOrderForm();
      await Promise.all([loadCatalog(), loadMyOrders()]);
      pollLoop();
    } catch (e) {
      // logout() already called by api() on 401; other errors just show login
    }
  }
  render();
})();
