<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Otiwarehouse</title>
<meta name="theme-color" content="#161A1F">
<link rel="icon" type="image/png" sizes="64x64" href="/brand/logo-64.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Otiwarehouse">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Otiwarehouse 1.11 — dark, muted design system. The accent is set per user
     at runtime (applyAccent) through --accent / --accent-ink / --accent-soft. */
  :root{
    --bg:#0E1013; --surface:#161A1F; --surface-2:#1D2228; --surface-3:#242A31;
    --line:#262C33; --line-2:#323A43;
    --ink:#E3E6EA; --ink-2:#AEB4BD; --muted:#7D8590;
    --accent:#A3277A; --accent-ink:#FFFFFF; --accent-soft:rgba(163,39,122,.16); --accent-line:rgba(163,39,122,.45); --accent-text:#E7A8D2;
    --ok:#5FB98A; --ok-soft:rgba(95,185,138,.12); --warn:#D9A54A; --warn-soft:rgba(217,165,74,.12); --bad:#E07A6E; --bad-soft:rgba(224,122,110,.12);
    --r:10px; --r-sm:8px; --shadow:0 12px 32px rgba(0,0,0,.35);
    --header-h:60px;
    /* legacy aliases used by inline styles */
    --paper:var(--bg); --bar:var(--surface); --safety:var(--accent); --rust:var(--bad); --radius:var(--r-sm);
    color-scheme:dark;
  }
  html[data-theme="light"]{
    --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#F1F3F6; --surface-3:#E8EBEF;
    --line:#E3E6EA; --line-2:#D3D8DE; --ink:#14171C; --ink-2:#434A54; --muted:#6B7280;
    --ok:#1F7A4D; --ok-soft:#E9F6EF; --warn:#9A5B05; --warn-soft:#FDF4E3; --bad:#B42318; --bad-soft:#FDECEA;
    --shadow:0 12px 30px rgba(17,24,39,.10); color-scheme:light;
  }
  html[data-theme="high-contrast"]{
    --bg:#000; --surface:#0A0A0A; --surface-2:#141414; --surface-3:#1E1E1E; --line:#7A7A7A; --line-2:#A0A0A0;
    --ink:#FFF; --ink-2:#F0F0F0; --muted:#D6D6D6; --ok:#6DFF9E; --warn:#FFD34D; --bad:#FF7A6B;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:var(--accent-text)}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  button:disabled{cursor:not-allowed;opacity:.5}
  code,.mono{font-family:ui-monospace,"SF Mono",Consolas,"IBM Plex Mono",monospace;font-size:.92em}
  .muted{color:var(--muted)}
  .label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input,select,textarea{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 11px;min-height:38px;width:100%;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
  input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--accent)}
  textarea{min-height:76px;resize:vertical}
  label{display:block;font-size:12px;font-weight:550;color:var(--ink-2);margin-bottom:5px}
  .mini-label{font-size:12px;font-weight:550;color:var(--ink-2);margin-bottom:5px}
  .field{margin-bottom:14px}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .err-line{color:var(--bad);font-size:13px;min-height:0}
  .err-line:empty{display:none}
  .warn-text{color:var(--warn)}

  /* buttons */
  .btn-primary,.btn-secondary,.btn-ghost,.add-cart{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:var(--r-sm);font-weight:600;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s,filter .15s,transform .1s}
  .btn-primary{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent)}
  .btn-primary:not(:disabled):hover{filter:brightness(1.1)}
  .btn-secondary{background:var(--surface-3);border:1px solid var(--line-2);color:var(--ink)}
  .btn-secondary:not(:disabled):hover{background:var(--line-2)}
  .btn-ghost{background:transparent;border:1px solid transparent;color:var(--ink-2)}
  .btn-ghost:hover{background:var(--surface-2)}
  .btn-sm{height:30px;padding:0 10px;font-size:12px}
  button:not(:disabled):active{transform:translateY(1px)}
  .link{background:none;border:0;color:var(--accent-text);padding:0;font-weight:550}
  .icon-btn{width:38px;height:38px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;color:var(--ink-2);position:relative;flex:none}
  .icon-btn:hover{background:var(--surface-2);color:var(--ink)}
  .icon-btn svg{width:18px;height:18px}
  .count-dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 2px var(--surface)}

  /* ---- header ---- */
  .top-shell{position:sticky;top:0;z-index:60;background:var(--surface);border-bottom:1px solid var(--line)}
  header.bar{height:var(--header-h);max-width:1600px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:22px}
  .brand{min-width:0;overflow:hidden;display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;letter-spacing:-.01em;white-space:nowrap;color:var(--ink);text-decoration:none}
  .brand img{width:32px;height:32px;border-radius:8px;display:block}
  nav.tabs{display:flex;align-self:stretch;gap:2px}
  nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:0 12px;color:var(--muted);font-weight:550;display:flex;align-items:center;gap:7px;white-space:nowrap}
  nav.tabs button:hover{color:var(--ink)}
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--accent)}
  .tab-n{background:var(--surface-3);color:var(--ink-2);border-radius:99px;padding:1px 7px;font-size:11px;font-weight:650}
  nav.tabs button.active .tab-n{background:var(--accent-soft);color:var(--accent-text)}
  .who{margin-left:auto;display:flex;align-items:center;gap:8px}
  .profile-btn{flex:none;display:flex;align-items:center;gap:8px;height:38px;padding:0 10px 0 4px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-weight:550}
  .profile-btn:hover{background:var(--surface-2)}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
  .announcement{background:var(--accent-soft);color:var(--ink);border-top:1px solid var(--accent-line);padding:9px 20px;text-align:center;font-size:13px}
  .mobile-tabs{display:none}

  /* profile menu */
  .menu{position:fixed;top:calc(var(--header-h) + 6px);right:16px;width:320px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);z-index:80;padding:8px;display:none;max-height:calc(100vh - 90px);overflow:auto}
  .menu.open{display:block;animation:pop .14s ease}
  @keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .menu-head{display:flex;gap:10px;align-items:center;padding:8px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .menu-head b{display:block}
  .menu-head small{color:var(--muted)}
  .menu-sec{padding:8px}
  .menu-sec h4{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--muted)}
  .menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:var(--r-sm);background:none;border:0;text-align:left;color:var(--ink)}
  .menu-item:hover{background:var(--surface-2)}
  .seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:2px}
  .seg button{flex:1;border:0;background:none;padding:6px 4px;border-radius:6px;font-size:12px;color:var(--ink-2)}
  .seg button.on{background:var(--surface-3);color:var(--ink);box-shadow:0 0 0 1px var(--line-2)}
  .swatches{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;margin-top:10px}
  .swatch{width:100%;margin:0;display:block;aspect-ratio:1;border-radius:50%;border:2px solid transparent;padding:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  .swatch.on{border-color:var(--ink)}
  .swatch.custom{background:conic-gradient(#E05A5A,#E0B84A,#5FB98A,#4A9BE0,#9A6BE0,#E05AB0,#E05A5A);position:relative;overflow:hidden}
  .swatch.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0;padding:0}
  .accent-note{font-size:11px;color:var(--muted);margin-top:8px}

  /* notifications */
  .notification-panel{position:fixed;top:calc(var(--header-h) + 6px);right:16px;width:360px;max-width:calc(100vw - 24px);max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);z-index:80;padding:10px}
  .notification-panel>strong{display:block;padding:6px 8px 10px}
  .notification-row{padding:10px;border-radius:var(--r-sm);cursor:pointer;border-left:3px solid transparent}
  .notification-row:hover{background:var(--surface-2)}
  .notification-row.unread{border-left-color:var(--accent);background:var(--accent-soft)}
  .notification-row div{color:var(--ink-2);font-size:13px;margin:2px 0}
  .notification-row small{color:var(--muted);font-size:11px}

  /* ---- layout ---- */
  main{max-width:1600px;margin:0 auto;padding:22px 20px 90px}
  main.catalog-shell{display:grid;grid-template-columns:220px minmax(0,1fr) 310px;gap:24px;align-items:start}
  main.catalog-shell.filters-collapsed{grid-template-columns:44px minmax(0,1fr) 310px}
  main.single-shell{max-width:1100px}
  main.single-shell.wide{max-width:1600px}
  .view-panel{min-width:0}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
  .page-head h1{margin:0;font-size:22px;letter-spacing:-.02em}
  .page-head p{margin:4px 0 0;color:var(--muted)}
  .section-title-row{margin-bottom:14px}

  /* filter rail */
  .filter-rail,.cart-rail{position:sticky;top:calc(var(--header-h) + 22px);max-height:calc(100vh - var(--header-h) - 40px);overflow:auto}
  .filter-panel{padding-right:2px}
  .rail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .rail-head strong{font-size:13px}
  .rail-controls{display:flex;gap:4px}
  .rail-collapse,.rail-close{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:grid;place-items:center}
  .rail-close{display:none}
  .filter-group{margin-bottom:18px}
  .filter-title{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px 2px}
  .filter-option{display:flex;justify-content:space-between;width:100%;padding:6px 10px;border:0;border-radius:6px;background:none;color:var(--ink-2);text-align:left;font-size:13px}
  .filter-option:hover{background:var(--surface-2);color:var(--ink)}
  .filter-option.active{background:var(--surface-2);color:var(--ink);font-weight:600;box-shadow:inset 2px 0 0 var(--accent)}
  .filter-n{color:var(--muted);font-size:12px}
  .filter-rail.collapsed .filter-group,.filter-rail.collapsed .rail-head strong{display:none}
  .filter-rail.collapsed .rail-head{justify-content:center}
  .sheet-foot{display:none}
  .filter-backdrop{display:none}

  /* toolbar + chips */
  .toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .search-box{flex:1;min-width:220px;position:relative}
  .search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
  .search-box input{padding-left:34px}
  .toolbar select{width:auto;min-width:130px}
  .mobile-filter-btn{display:none}
  .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
  .result-count{color:var(--muted);font-size:13px;margin-right:4px}
  .chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 10px;border-radius:99px;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--ink);font-size:12px;font-weight:550}
  .chip button{border:0;background:none;color:var(--ink-2);width:18px;height:18px;border-radius:50%;display:grid;place-items:center;padding:0;font-size:13px;line-height:1}
  .chip button:hover{background:rgba(255,255,255,.12)}
  .clear-filters{border:0;background:none;color:var(--accent-text);font-size:12px;font-weight:600;padding:4px 6px}

  /* ---- item cards ---- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
  .tag{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,box-shadow .2s;position:relative}
  .tag:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
  .tag.flash{animation:flash 1.2s ease}
  @keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:none}}
  .tag .photo{aspect-ratio:4/3;background:var(--surface-2);position:relative;display:grid;place-items:center;overflow:hidden}
  .tag .photo img{width:100%;height:100%;object-fit:contain;cursor:zoom-in;padding:10px}
  .photo-fallback{font-size:42px;opacity:.55}
  .favorite-btn{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:rgba(14,16,19,.72);color:var(--ink-2);z-index:2;display:grid;place-items:center;font-size:14px;backdrop-filter:blur(4px)}
  html[data-theme="light"] .favorite-btn{background:rgba(255,255,255,.9)}
  .favorite-btn.active{color:#F2C14E;border-color:#F2C14E66}
  .stock-badge{position:absolute;left:10px;bottom:10px;z-index:2}
  .perf{display:none}
  .tag .body{padding:13px 14px 14px;display:flex;flex-direction:column;gap:9px;flex:1}
  .tag .code{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted)}
  .tag .name{font-weight:600;font-size:15px;line-height:1.3;margin-top:1px}
  .tag .meta{color:var(--muted);font-size:12.5px}
  .pill,.stock-badge,.estimate-pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.5}
  .pill::before,.stock-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
  .pill.ok,.stock-badge.in_stock{background:var(--ok-soft);color:var(--ok)}
  .pill.warn,.stock-badge.low_stock,.stock-badge.not_counted{background:var(--warn-soft);color:var(--warn)}
  .pill.bad,.stock-badge.out_of_stock{background:var(--bad-soft);color:var(--bad)}
  .pill.neutral{background:var(--surface-3);color:var(--ink-2)}
  .pill.neutral::before{display:none}
  .stock-badge{background:rgba(14,16,19,.85)!important;backdrop-filter:blur(4px)}
  html[data-theme="light"] .stock-badge{background:rgba(255,255,255,.92)!important}
  .estimate-pill{background:var(--warn-soft);color:var(--warn);font-size:10.5px;padding:1px 7px}
  .stock-line{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .stock-sub{font-size:11.5px;color:var(--muted)}
  .limit-note{font-size:11.5px;color:var(--ink-2)}
  .location-badges{display:flex;gap:6px}
  .loc-badge{display:inline-flex;gap:6px;align-items:center;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--ink-2)}
  .loc-badge b{color:var(--muted);font-weight:600;font-family:ui-monospace,Consolas,monospace}
  .loc-badge.zero{opacity:.55}
  .other-location-note,.count-flag{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:5px 8px}
  .sub-suggest{display:flex;align-items:center;gap:8px;font-size:12px;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--r-sm);padding:7px 9px}
  .sub-suggest button{margin-left:auto}
  .variant-picker label{margin-bottom:4px}
  .variant-picker select{min-height:34px;padding:6px 9px}
  .row-bottom{display:none}
  .buy-row{display:flex;gap:8px;align-items:center;margin-top:auto}
  .stepper{display:flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);height:38px;flex:none}
  .stepper button{width:32px;border:0;background:none;color:var(--ink-2);font-size:16px}
  .stepper button:not(:disabled):hover{background:var(--surface-3);color:var(--ink)}
  .stepper input,.qty{width:46px;min-height:0;height:100%;border:0;border-left:1px solid var(--line-2);border-right:1px solid var(--line-2);border-radius:0;text-align:center;padding:0;background:transparent;-moz-appearance:textfield}
  .stepper input:focus{box-shadow:none}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .add-cart{flex:1;background:var(--surface-3);border:1px solid var(--line-2);color:var(--ink)}
  .add-cart:not(:disabled):hover{background:var(--line-2)}
  .add-cart.in-cart{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-text)}
  .card-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .estimated-mark{display:flex;align-items:center;gap:6px;margin:0;font-size:12px;color:var(--muted);font-weight:500}
  .request-count{border:0;background:none;color:var(--accent-text);font-size:12px;font-weight:550;padding:0}
  .card-buy{display:contents}
  .draft-note{display:none}
  .tag.out-of-stock .photo img{filter:grayscale(.6);opacity:.7}
  .in-cart-flag{position:absolute;top:10px;left:10px;z-index:2;background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:11px;font-weight:700;padding:2px 8px}

  /* kits */
  .kit-section{margin-top:28px}
  .cat-head{display:flex;align-items:center;gap:8px;font-weight:650;font-size:15px;margin-bottom:12px}
  .cat-head .n{background:var(--surface-3);color:var(--ink-2);border-radius:99px;padding:1px 8px;font-size:12px}
  .kit-parts{display:flex;flex-wrap:wrap;gap:5px}
  .kit-part{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:3px 7px;font-size:11px;color:var(--ink-2)}
  .kit-part img{width:20px;height:20px;object-fit:contain;border-radius:3px}
  .kit-product-card .stock{font-size:12px;color:var(--muted)}

  /* ---- order panel (cart rail + drawer) ---- */
  .compact-cart,.slip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
  .slip-head{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
  .slip-head .label{font-size:12px}
  .slip-head h2{margin:2px 0 0;font-size:16px}
  .lines{padding:8px 10px;max-height:340px;overflow:auto}
  .line{display:grid;grid-template-columns:38px minmax(0,1fr) auto 26px;gap:9px;align-items:center;padding:7px 4px;border-radius:var(--r-sm)}
  .line+.line{border-top:1px solid var(--line)}
  .cart-thumb{width:38px;height:38px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;font-size:16px}
  .cart-thumb img{width:100%;height:100%;object-fit:contain}
  .nm{font-size:13px;font-weight:550;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .nm .cd{display:block;font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted);font-weight:400}
  .line .mono{font-weight:600}
  .rm{width:26px;height:26px;border-radius:6px;border:0;background:none;color:var(--muted)}
  .rm:hover{background:var(--bad-soft);color:var(--bad)}
  .empty,.empty-state{color:var(--muted);text-align:center;padding:22px 12px;font-size:13px}
  .empty-state{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);padding:40px 16px}
  .readiness{padding:12px 16px;border-top:1px solid var(--line)}
  .readiness h3{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--muted)}

  /* ---- delivery / setup ---- */
  .setup-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}

  .card-h p{margin:3px 0 0;color:var(--muted);font-size:13px}

  .card-b>*+*{margin-top:12px}
  .project-builder>*+*{margin-top:12px}
  .address-box{border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;background:var(--surface-2)}

  .plan-item span{display:block;font-size:11px;color:var(--muted)}

  .project-help{font-size:12.5px;color:var(--muted)}

  .attendee-upload-card,.printouts-card{display:grid;gap:12px}

  .upload-drop small{color:var(--muted);font-weight:400}
  .attendee-preview{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;background:var(--surface-2);border-radius:var(--r-sm);padding:10px}
  .print-row{display:grid;grid-template-columns:minmax(0,1fr) 70px 120px 110px 100px 30px;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2)}

  .print-row .fname small{display:block;color:var(--muted);font-weight:400}
  .print-row input,.print-row select{min-height:32px;padding:5px 8px;font-size:12.5px;background:var(--surface)}
  .print-row .notes-in{grid-column:1/-2}
  .collab-box h3{margin:0 0 4px;font-size:13px}
  .collab-help{color:var(--muted);font-size:12.5px;margin-bottom:8px}
  .collab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;max-height:200px;overflow:auto}
  .collab-option{display:flex;align-items:center;gap:8px;margin:0;padding:7px 9px;border:1px solid var(--line);border-radius:var(--r-sm);font-weight:450;color:var(--ink);font-size:13px}
  .collab-option small{color:var(--muted)}
  .order-readiness-box{border:1px solid var(--ok);background:var(--ok-soft);border-radius:var(--r-sm);padding:12px 14px;font-size:13px}
  .order-readiness-box.incomplete{border-color:var(--warn);background:var(--warn-soft)}
  .order-readiness-box ul{margin:6px 0 0;padding-left:18px;color:var(--ink-2)}
  .setup-empty-warning{border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;margin:12px}
  .foot{padding:14px}
  .foot>*+*{margin-top:12px}
  #submit-order,#review-order{width:100%;height:44px;font-size:14px}

  /* review modal */
  .review-sec{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:10px}
  .review-sec h4{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between}
  .review-line{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;border-top:1px solid var(--line)}
  .review-line:first-of-type{border-top:0}
  .review-warn{color:var(--warn);font-size:12px}
  .review-bad{color:var(--bad);font-size:12px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
  .kv span{color:var(--muted)}

  /* ---- orders ---- */
  .orders-list{display:grid;gap:14px}
  .order-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
  .order-card.incomplete{border-color:var(--warn)}
  .top-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .oid{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted)}
  .proj{font-weight:650;font-size:16px;margin-top:2px}
  .proj-meta{color:var(--muted);font-size:12.5px}
  .stamp{border-radius:99px;padding:3px 11px;font-size:12px;font-weight:650;text-transform:capitalize;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
  .stamp.pending{background:var(--warn-soft);color:var(--warn)}
  .stamp.approved,.stamp.picking{background:var(--accent-soft);color:var(--accent-text)}
  .stamp.fulfilled{background:var(--ok-soft);color:var(--ok)}
  .stamp.rejected,.stamp.cancelled{background:var(--bad-soft);color:var(--bad)}
  .order-meta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0;padding:12px;background:var(--surface-2);border-radius:var(--r-sm)}
  .meta-label{display:block;font-size:11px;color:var(--muted)}
  .meta-value{font-size:13px;font-weight:550}
  .incomplete-note{font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:7px 10px;margin-bottom:10px}
  .items-head,.lines-mini>div{display:grid;grid-template-columns:minmax(0,1fr) 150px 80px;gap:10px}
  .items-head{font-size:11px;color:var(--muted);padding:0 2px 6px;border-bottom:1px solid var(--line)}
  .lines-mini>div{padding:7px 2px;border-bottom:1px solid var(--line);font-size:13px}
  .line-code{color:var(--muted)}
  .line-qty{text-align:right}
  .order-kit-summary{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  .kit-summary-chip{padding:4px 9px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;font-size:12px}
  .kit-summary-chip.folder{border-color:var(--accent-line);color:var(--accent-text)}
  .attendee-order-files,.collab-list,.notes,.print-files-list{margin-top:10px;font-size:13px;color:var(--ink-2)}
  .print-files-list a{color:var(--accent-text)}
  .notes{font-style:italic}
  .tracking-box{margin-top:12px;border:1px solid var(--ok);background:var(--ok-soft);border-radius:var(--r-sm);padding:10px 12px;font-size:13px}
  .proof-strip{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .proof-strip img{width:84px;height:84px;object-fit:cover;border-radius:6px;cursor:zoom-in}
  .order-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

  /* ---- folder + badge frames ---- */
  .frame-shell{padding:0;max-width:none}
  .folder-builder-frame,.badge-frame{display:block;width:100%;height:calc(100vh - var(--header-h) - 1px);border:0;background:var(--bg)}
  .badge-bar{display:flex;gap:10px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
  .badge-bar select{width:auto;min-width:260px}
  .badge-bar .grow{flex:1}
  .badge-frame{height:calc(100vh - var(--header-h) - 59px)}

  /* ---- login ---- */
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 50% -10%,var(--accent-soft),transparent 60%),var(--bg)}
  .login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 28px;box-shadow:var(--shadow)}
  .login-card .brand{flex-direction:column;gap:12px;font-size:20px;margin-bottom:6px}
  .login-card .brand img{width:64px;height:64px;border-radius:16px}
  .login-card .sub{color:var(--muted);text-align:center;margin-bottom:22px;font-size:13px}
  .login-card .btn-primary{height:42px;margin-top:4px}
  .server-toggle{display:block;margin:16px auto 0;border:0;background:none;color:var(--muted);font-size:12px}
  .server-field{margin-top:10px}
  .version-foot{text-align:center;color:var(--muted);font-size:11px;margin-top:16px}

  /* ---- modal / lightbox / toast ---- */
  .modal-backdrop,.lightbox{position:fixed;inset:0;background:rgba(5,6,8,.72);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .18s,visibility .18s}
  .modal-backdrop.open,.lightbox.open{opacity:1;visibility:visible}
  .modal-card{width:min(640px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:22px;box-shadow:var(--shadow);transform:translateY(8px);transition:transform .18s}
  .modal-card.wide{width:min(860px,100%)}
  .modal-backdrop.open .modal-card{transform:none}
  .modal-card h2{margin:0 0 4px;font-size:18px}
  .modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
  .modal-x{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);font-size:18px;line-height:1}
  .modal-sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
  .edit-line{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .estimated-edit{display:flex;gap:6px;align-items:center;margin:0;font-weight:450}
  .nav-count-info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
  .nav-count-stat{background:var(--surface-2);border-radius:var(--r-sm);padding:10px}
  .nav-count-stat span{display:block;font-size:11px;color:var(--muted)}
  .request-history{display:grid;gap:8px;margin-top:10px}
  .request-history-row{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;font-size:13px}
  .request-history-row small{color:var(--muted)}
  .bulk-preview{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);margin-top:10px}
  .bulk-row{display:grid;grid-template-columns:120px minmax(0,1fr) 70px 140px;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
  .bulk-row:last-child{border-bottom:0}
  .bulk-row.bad{color:var(--bad)}
  .bulk-row .st{font-size:12px}
  .lightbox img{max-width:min(1100px,94vw);max-height:86vh;object-fit:contain;border-radius:8px;background:#fff}
  .lightbox-close,.lightbox-prev,.lightbox-next{position:absolute;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:10px}
  .lightbox-close{top:18px;right:18px;width:40px;height:40px;font-size:18px}
  .lightbox-prev,.lightbox-next{top:50%;transform:translateY(-50%);width:44px;height:56px;font-size:28px}
  .lightbox-prev{left:18px}.lightbox-next{right:18px}
  .lightbox-count{position:absolute;bottom:18px;color:#fff;font-size:12px}
  #toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--surface-3);color:var(--ink);border:1px solid var(--line-2);border-left:4px solid var(--accent);padding:11px 16px;border-radius:var(--r-sm);font-size:13px;box-shadow:var(--shadow);z-index:200;opacity:0;visibility:hidden;transition:.2s;max-width:min(560px,92vw)}
  #toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
  #toast.err{border-left-color:var(--bad)}
  .loading{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);padding:40px}
  .spinner{width:20px;height:20px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .feature-banner{display:none}

  /* ---- responsive ---- */
  @media (max-width:1200px){
    main.catalog-shell{grid-template-columns:200px minmax(0,1fr) 280px;gap:18px}
    nav.tabs button{padding:0 9px}
    .profile-btn span.nm-full{display:none}
  }
  @media (max-width:980px){
    header.bar{gap:12px;padding:0 14px}
    nav.tabs{display:none}
    .mobile-tabs{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
    .mobile-tabs::-webkit-scrollbar{display:none}
    .mobile-tabs button{flex:none;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:550;display:flex;gap:6px;align-items:center}
    .mobile-tabs button.active{background:var(--accent-soft);border-color:var(--accent-line);color:var(--ink)}
    main{padding:16px 14px 100px}
    main.catalog-shell,main.catalog-shell.filters-collapsed{display:block}
    .cart-rail{display:none}
    .filter-rail{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:82vh;z-index:92;background:var(--surface);border-top:1px solid var(--line-2);border-radius:18px 18px 0 0;padding:8px 16px 0;transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
    .filter-rail::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line-2);margin:4px auto 10px}
    .filter-rail.open{transform:none}
    .filter-rail.collapsed .filter-group,.filter-rail.collapsed .rail-head strong{display:block}
    .rail-collapse{display:none}
    .rail-close{display:grid}
    .sheet-foot{display:block;position:sticky;bottom:0;background:var(--surface);padding:12px 0 16px;border-top:1px solid var(--line)}
    .sheet-foot .btn-primary{width:100%;height:44px}
    .filter-backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:91;opacity:0;visibility:hidden;transition:.2s}
    .filter-backdrop.open{opacity:1;visibility:visible}
    .mobile-filter-btn{display:inline-flex}
    .mobile-cart-bar{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:55;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;height:52px;padding:0 16px;align-items:center;justify-content:space-between;font-weight:650;box-shadow:0 10px 30px rgba(0,0,0,.4)}
    .mobile-cart-bar .cart-total{opacity:.85;font-weight:550}
    .setup-grid{grid-template-columns:1fr}
    .setup-side{position:static}
    .folder-builder-frame{height:calc(100vh - var(--header-h) - 48px)}
    .badge-frame{height:calc(100vh - var(--header-h) - 110px)}
  }
  @media (max-width:640px){
    .grid{grid-template-columns:1fr 1fr;gap:10px}
    .tag .body{padding:10px;gap:7px}
    .tag .name{font-size:13.5px}
    .tag .meta,.location-badges,.card-actions .estimated-mark{display:none}
    .buy-row{flex-direction:column;align-items:stretch}
    .stepper{width:100%}
    .stepper input{flex:1}
    .toolbar select{flex:1;min-width:0}
    .search-box{flex-basis:100%;order:-1}
    .page-head .btn-secondary{width:100%}
    .who{gap:6px}
    .two-col,.modal-grid,.shipping-plan{grid-template-columns:1fr 1fr}
    .print-row{grid-template-columns:1fr 1fr;}
    .print-row .fname,.print-row .notes-in{grid-column:1/-1}
    .items-head,.lines-mini>div{grid-template-columns:minmax(0,1fr) 60px}
    .items-head span:nth-child(2),.lines-mini .line-code{display:none}
    .profile-btn{padding:0 3px}
    .profile-btn .nm-full{display:none}
    .brand span.brand-name{font-size:14px}
    .nav-count-info{grid-template-columns:1fr}
    .bulk-row{grid-template-columns:90px minmax(0,1fr) 50px}
    .bulk-row .st{grid-column:1/-1}
  }
  @media (max-width:380px){.grid{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  @media print{.top-shell,.mobile-cart-bar,.cart-rail,.filter-rail{display:none!important}}
</style>

<script>
/* ---------------------------------------------------------------------
   Otiwarehouse — ordering frontend (build 1.11).
   Static file, no build step — open it from the shared drive or host it
   next to the backend. Talks to the FastAPI backend over bearer-token
   auth (see backend/main.py for the CORS rationale).
   ------------------------------------------------------------------- */

// When this page is served BY the backend itself (Render, or any host
// running main.py), talking to "itself" is exactly right — no manual
// server address needed at all, which matters most on a phone where
// typing a URL into a settings field is annoying. Opening the file
// directly (file://) has no real origin to detect, so that case keeps
// the old localhost default for local testing.
const APP_VERSION = "1.11";
const DEFAULT_API_BASE =
  (location.protocol === "file:" || !location.origin || location.origin === "null")
    ? "http://localhost:8000"
    : location.origin;

// Conservative state-level defaults transcribed from the supplied UPS Ground
// outbound map. Several states contain more than one ZIP-level zone, so the
// transit time is locked to the supplied UPS state map.
const GROUND_DAYS_BY_STATE = {
  CT:1, DC:1, DE:1, MA:1, MD:1, NJ:1, NY:1, PA:1, RI:1, VT:1,
  GA:2, IN:2, KY:2, ME:2, MI:2, NC:2, NH:2, OH:2, SC:2, TN:2, VA:2, WV:2,
  AL:3, AR:3, AZ:3, FL:3, IA:3, IL:3, KS:3, LA:3, MN:3, MO:3, MS:3, NE:3, NM:3, WI:3,
  CO:4, MT:4, ND:4, OK:4, SD:4, TX:4,
  AK:5, CA:5, HI:5, ID:5, NV:5, OR:5, PR:5, UT:5, VI:5, WA:5, WY:5,
};
const US_STATES = [
  ["AL","Alabama"],["AK","Alaska"],["AZ","Arizona"],["AR","Arkansas"],
  ["CA","California"],["CO","Colorado"],["CT","Connecticut"],["DE","Delaware"],
  ["DC","District of Columbia"],["FL","Florida"],["GA","Georgia"],["HI","Hawaii"],
  ["ID","Idaho"],["IL","Illinois"],["IN","Indiana"],["IA","Iowa"],
  ["KS","Kansas"],["KY","Kentucky"],["LA","Louisiana"],["ME","Maine"],
  ["MD","Maryland"],["MA","Massachusetts"],["MI","Michigan"],["MN","Minnesota"],
  ["MS","Mississippi"],["MO","Missouri"],["MT","Montana"],["NE","Nebraska"],
  ["NV","Nevada"],["NH","New Hampshire"],["NJ","New Jersey"],["NM","New Mexico"],
  ["NY","New York"],["NC","North Carolina"],["ND","North Dakota"],["OH","Ohio"],

function parseIsoDate(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(value || "")) return null;
  const [y,m,d] = value.split("-").map(Number);
  const result = new Date(y, m - 1, d, 12, 0, 0);
  return result.getFullYear() === y && result.getMonth() === m - 1 && result.getDate() === d ? result : null;
}
function isoFromDate(value) {
  const y = value.getFullYear();
  const m = String(value.getMonth() + 1).padStart(2, "0");
  const d = String(value.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}
function observedFixed(year, monthIndex, day) {
  const d = new Date(year, monthIndex, day, 12);
  if (d.getDay() === 6) d.setDate(d.getDate() - 1);
  else if (d.getDay() === 0) d.setDate(d.getDate() + 1);
  return d;
}
function nthWeekday(year, monthIndex, weekday, n) {
  const d = new Date(year, monthIndex, 1, 12);
  d.setDate(1 + ((weekday - d.getDay() + 7) % 7) + (n - 1) * 7);
  return d;
}
function lastWeekday(year, monthIndex, weekday) {
  const d = new Date(year, monthIndex + 1, 0, 12);
  d.setDate(d.getDate() - ((d.getDay() - weekday + 7) % 7));
  return d;
}
function federalHolidaySet(year) {
  return new Set([
    observedFixed(year,0,1), nthWeekday(year,0,1,3), nthWeekday(year,1,1,3),
    lastWeekday(year,4,1), observedFixed(year,5,19), observedFixed(year,6,4),
    nthWeekday(year,8,1,1), nthWeekday(year,9,1,2), observedFixed(year,10,11),
    nthWeekday(year,10,4,4), observedFixed(year,11,25),
  ].map(isoFromDate));
}
function isBusinessDate(value) {
  if (value.getDay() === 0 || value.getDay() === 6) return false;
  const iso = isoFromDate(value);
  for (const y of [value.getFullYear()-1, value.getFullYear(), value.getFullYear()+1]) {
    if (federalHolidaySet(y).has(iso)) return false;
  }
  return true;
}
function previousBusinessDate(value) {
  const d = new Date(value);
  do { d.setDate(d.getDate() - 1); } while (!isBusinessDate(d));
  return d;
}
function subtractBusinessDates(value, count) {
  const d = new Date(value);
  let left = Number(count) || 0;
  while (left > 0) {
    d.setDate(d.getDate() - 1);
    if (isBusinessDate(d)) left -= 1;
  }
  return d;
}
function shippingPlanForForm(form) {
  const event = parseIsoDate(form.eventDate);
  const stateCode = (form.shippingState || "").toUpperCase();
  const days = GROUND_DAYS_BY_STATE[stateCode];
  if (!event || !days) return null;
  const delivery = previousBusinessDate(event);
  const shipBy = subtractBusinessDates(delivery, days);
  return { deliveryDate: isoFromDate(delivery), shipByDate: isoFromDate(shipBy), days };
}

  return [attn, street, cityLine].filter(Boolean).join(" · ");
}

async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  if (opts.body && !(opts.body instanceof FormData)) headers["Content-Type"] = "application/json";
  if (state.token) headers["Authorization"] = "Bearer " + state.token;

  let res;
  try {
    res = await fetch(state.apiBase + path, Object.assign({}, opts, { headers }));
  } catch (e) {
    throw new Error("Couldn't reach the server at " + state.apiBase + ". Check the server address and that the backend is running.");
  }

  if (res.status === 401) {
    logout("Your session expired. Log in again.");
    throw new Error("Session expired.");
  }

  if (!res.ok) {
    let detail = "Request failed (" + res.status + ").";
    try {
      const body = await res.json();
      if (body && body.detail) detail = typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail);
    } catch (_) {}
    throw new Error(detail);
  }
  if (res.status === 204) return null;
  return res.json();
}

function stopPolling() {
  state.polling = false;
  if (pollAbort) pollAbort.aborted = true;
}

async function pollLoop() {
  if (state.polling) return;
  state.polling = true;
  const myGate = { aborted: false };
  pollAbort = myGate;
  while (!myGate.aborted && state.token) {
    try {
      const since = encodeURIComponent(state.lastPollTime || new Date().toISOString());
      const res = await api("/orders/updates?since=" + since);
      if (myGate.aborted) break;
      state.lastPollTime = res.server_time;
      if (res.orders && res.orders.length) {
        const byId = Object.fromEntries(state.myOrders.map(o => [o.id, o]));
        res.orders.forEach(o => {
          if (o.deleted) delete byId[o.id];
          else byId[o.id] = o;
        });
        state.myOrders = Object.values(byId).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        if (state.tab === "orders") render();
        res.orders.forEach(o => {
          toast(o.deleted ? ((o.order_number || ("ORD-" + String(o.id).padStart(6,"0"))) + " was deleted.") : ((o.order_number || ("ORD-" + String(o.id).padStart(6,"0"))) + " is now " + o.status + "."));
        });
      }
    } catch (e) {
      if (myGate.aborted) break;
      await new Promise(r => setTimeout(r, 4000));
    }
  }
}

function commitItemToCart(itemId) {
  const item = state.catalog.find(i => i.id === Number(itemId));
  if (!item) return;
  const qty = draftQtyFor(item);
  if (!Number.isInteger(qty) || qty <= 0) {
    toast("Enter a quantity before adding this item.", true);
    return;
  }
  const maxQty=itemAvailability(item);
  if (qty > maxQty) {
    toast("Only " + maxQty + " are currently available for this selection.", true);
    return;
  }
  const updating = Boolean(state.cart[item.id]);
  state.cart[item.id] = qty;
  const variant=selectedVariant(item); if(variant) state.cartVariants[item.id]=variant.id; else delete state.cartVariants[item.id];
  if (draftEstimatedFor(item.id)) state.estimated[item.id] = true;
  else delete state.estimated[item.id];
  state.draftQty[item.id] = qty;
  state.draftEstimated[item.id] = Boolean(state.estimated[item.id]);
  markRecentlyViewed(item.id);
  saveCartDraft();
  render();
  toast(updating ? (item.name + " updated in your order.") : (item.name + " added to your order."));
}

function buildProjectPayload() {
  const f = state.orderForm;
  if (f.projectChoice === "none") return {};
  if (f.projectChoice.startsWith("saved:")) {
    const projectId = Number(f.projectChoice.split(":", 2)[1]);
    const saved = state.projects.find(p => p.id === projectId);
    if (!saved) throw new Error("That saved project is no longer available.");
    if (saved.address_mode === "fixed") return { project_id: projectId };
    const plan = shippingPlanForForm(f);
    const address = normalizedAddress(f);
    const attendees = f.attendees === "" ? saved.attendees : Number(f.attendees);
    return {
      project_id: projectId,
      new_project: {
        name: saved.name, owner: saved.owner || f.projectOwner.trim(),
        event_date: f.eventDate || saved.event_date || "",
        delivery_date: plan ? plan.deliveryDate : "",
        ship_by_date: plan ? plan.shipByDate : "",
        location: f.projectLocation.trim() || saved.location || "",
        shipping_address1: address.shipping_address1,
        shipping_address2: address.shipping_address2,
        shipping_city: address.shipping_city,
        shipping_state: address.shipping_state,
        shipping_postal_code: address.shipping_postal_code,
        shipping_service: "UPS Ground", ups_ground_days: plan ? plan.days : null,
        attendees: attendees == null || attendees === "" ? null : attendees,
        description: saved.description || "", address_mode: "variable",
      },
      save_project: false,
    };
  }
  if (!f.projectName.trim()) throw new Error("Enter a project or event name for this order.");
  if (!f.eventDate) throw new Error("Enter the event date.");
  const plan = shippingPlanForForm(f);
  const address = normalizedAddress(f);
  const attendees = f.attendees === "" ? null : Number(f.attendees);
  if (attendees != null && (!Number.isInteger(attendees) || attendees < 0)) {
    throw new Error("Attendees must be a whole number of zero or more.");
  }
  return {
    new_project: {
      name: f.projectName.trim(), owner: f.projectOwner.trim(),
      event_date: f.eventDate,
      delivery_date: plan ? plan.deliveryDate : "",
      ship_by_date: plan ? plan.shipByDate : "",
      location: f.projectLocation.trim(),
      shipping_address1: address.shipping_address1,
      shipping_address2: address.shipping_address2,
      shipping_attention: address.shipping_attention,
      shipping_city: address.shipping_city,
      shipping_state: address.shipping_state,
      shipping_postal_code: address.shipping_postal_code,
      shipping_service: "UPS Ground",
      ups_ground_days: plan ? plan.days : null,
      attendees, description: f.projectDescription.trim(),
    },
    save_project: Boolean(f.saveProject),
  };
}

async function doLogin(username, password) {
  state.loginError = "";
  try {
    const res = await fetch(state.apiBase + "/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || "Invalid username or password.");
    }
    const data = await res.json();
    state.token = data.token;
    state.user = data.user;
    applyTheme(data.user.theme || state.theme);
    if (data.user.accent_color) applyAccent(data.user.accent_color);
    state.orderForm = blankOrderForm();
    saveSession();
    await Promise.all([loadCatalog(), loadMyOrders()]);
    pollLoop();
  } catch (e) {
    state.loginError = e.message.includes("fetch") || e.message.includes("reach")
      ? "Couldn't reach the server at " + state.apiBase + ". Check the server address."
      : e.message;
  }
  render();
}

function esc(s) {

function itemImageUrls(item){return (item.image_ids||[]).map(id=>`${state.apiBase}/item-images/${id}?access_token=${encodeURIComponent(state.token||"")}&v=${id}`);}
function imgUrl(item) {
  const ids = item.image_ids || [];
  if (!ids.length) return null;
  // Use the primary image record directly. Replacing/uploading a photo creates
  // a new primary image id, so the browser receives a new URL instead of a
  // cached response from /catalog/{item_id}/image. The extra nonce also keeps
  // proxies from retaining an older copy of the same image record.
  const id = ids[0];
  return `${state.apiBase}/item-images/${id}?access_token=${encodeURIComponent(state.token||"")}&v=${id}-${Date.now()}`;
}

function handleImageError(img) {
  const holder = img && img.closest ? img.closest(".photo") : null;
  if (!holder) return;
  img.remove();
  if (!holder.querySelector(".photo-fallback")) {
    const fallback = document.createElement("span");
    fallback.className = "photo-fallback";
    fallback.textContent = "📦";
    fallback.title = "Photo file is missing from the server";
    holder.prepend(fallback);
  }
}

function activeVariants(item){return (item.variants||[]).filter(v=>v.active);}
function selectedVariant(item){const vs=activeVariants(item);if(!vs.length)return null;let id=Number(state.selectedVariants[item.id]||state.cartVariants[item.id]||vs[0].id);let v=vs.find(x=>Number(x.id)===id)||vs[0];state.selectedVariants[item.id]=v.id;return v;}
function locationQuantities(item){const v=selectedVariant(item);if(v)return {"0":Number(v.qty_location_0||0),"2501":Number(v.qty_location_2501||0)};const b={"0":0,"2501":0};(item.location_balances||[]).forEach(x=>b[x.location_name]=Number(x.quantity||0));return b;}
function itemPhotoForVariant(item){const v=selectedVariant(item);if(v&&v.image_id)return `${state.apiBase}/item-images/${v.image_id}?access_token=${encodeURIComponent(state.token||"")}&v=${v.image_id}`;return imgUrl(item);}

function frequentItemIds() {
  const counts = new Map();
  state.myOrders.forEach(order => (order.lines || []).forEach(line => {
    counts.set(Number(line.item_id), (counts.get(Number(line.item_id)) || 0) + Number(line.qty_requested || 0));
  }));
  return [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 10).map(([id]) => id);
}

function quickFilterCounts() {
  const frequent = new Set(frequentItemIds());
  const recent = new Set(state.recentlyViewed.map(Number));
  return {
    all: state.catalog.length,
    low: state.catalog.filter(i => i.qty_on_hand <= i.reorder_threshold).length,
    recount: state.catalog.filter(i => Number(i.open_count_requests || 0) > 0).length,
    frequent: state.catalog.filter(i => frequent.has(Number(i.id))).length,
    recent: state.catalog.filter(i => recent.has(Number(i.id))).length,
    favorites: state.catalog.filter(i => Boolean(i.favorite)).length,
  };
}

function filteredCatalog() {
  const q = state.search.trim().toLowerCase();
  const frequent = new Set(frequentItemIds());
  const recent = new Set(state.recentlyViewed.map(Number));
  const items = state.catalog.filter(i => {
    if (state.category && i.category !== state.category) return false;
    if (state.brand && (i.brand || "Unbranded") !== state.brand) return false;
    if (state.quickFilter === "low" && i.qty_on_hand > i.reorder_threshold) return false;
    if (state.quickFilter === "recount" && Number(i.open_count_requests || 0) <= 0) return false;
    if (state.quickFilter === "frequent" && !frequent.has(Number(i.id))) return false;
    if (state.quickFilter === "recent" && !recent.has(Number(i.id))) return false;
    if (state.quickFilter === "favorites" && !i.favorite) return false;
    if (!q) return true;
    return (i.name + " " + i.code + " " + (i.description || "") + " " + (i.location || "")).toLowerCase().includes(q);
  });
  const by = state.sort;
  items.sort((a, b) => {
    if (state.quickFilter === "favorites" && a.favorite !== b.favorite) return a.favorite ? -1 : 1;
    if (state.quickFilter === "recent" && by === "name") {
      return state.recentlyViewed.indexOf(Number(a.id)) - state.recentlyViewed.indexOf(Number(b.id));
    }
    if (by === "code") return a.code.localeCompare(b.code);
    if (by === "stock") return a.qty_on_hand - b.qty_on_hand;
    if (by === "location") return String(a.location || "~~~~").localeCompare(String(b.location || "~~~~"), undefined, { numeric:true });
    return a.name.localeCompare(b.name);
  });
  return items;
}

function groupByCategory(items) {
  const groups = new Map();
  items.forEach(i => {
    const key = i.category || "Uncategorized";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(i);
  });
  return [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0]));
}

function displayDate(value) {
  if (!value) return "";
  const m = String(value).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[2]}/${m[3]}/${m[1]}` : String(value);
}

function orderReadiness() {
  const f = state.orderForm;
  const lines = cartLinesData();
  const kitLines = kitCartLinesData();
  const estimatedCount = lines.filter(line => line.estimated).length;
  const saved = selectedProjectForReadiness();
  let project = "Pending", eventDate = "Pending", address = "Pending", shipBy = "Pending";
  const issues = [];

  if (!lines.length && !kitLines.length) issues.push("Add at least one item.");
  if (f.projectChoice === "new") {
    project = f.projectName.trim() || "Pending";
    eventDate = f.eventDate || "Pending";
    const addressComplete = addressIsComplete(f);
    address = addressComplete ? "Complete" : "Address pending";
    const plan = shippingPlanForForm(f);
    shipBy = plan ? plan.shipByDate : "Pending";
    if (!f.projectName.trim()) issues.push("Project or event name is missing.");
    if (!f.eventDate) issues.push("Event date is missing.");
    if (!addressComplete) issues.push("Delivery address is incomplete.");
    if (!plan) issues.push("UPS Ground ship-by date is pending.");
  } else if (f.projectChoice === "none") {
    project = "No project";
    issues.push("Delivery address and event details will remain incomplete.");
  } else if (saved) {
    project = saved.name || "Saved project";
    const variable = saved.address_mode !== "fixed";
    eventDate = variable ? (f.eventDate || saved.event_date || "Pending") : (saved.event_date || "Pending");
    const addressComplete = variable
      ? addressIsComplete(f)
      : addressIsComplete(saved);
    address = addressComplete ? "Complete" : "Address pending";
    const plan = variable ? shippingPlanForForm(Object.assign({}, f, {eventDate})) : null;
    shipBy = variable ? (plan ? plan.shipByDate : "Pending") : (saved.ship_by_date || "Pending");
    if (eventDate === "Pending") issues.push("Event date is missing.");
    if (!addressComplete) issues.push(variable ? "Enter this order's delivery address." : "Delivery address is incomplete in the saved project.");
    if (shipBy === "Pending") issues.push("UPS Ground ship-by date is pending.");

  return {
    lines, estimatedCount, issues,
    rows: [
      ["Items", (lines.length||kitLines.length) ? cartCount() + " units" : "None", (lines.length||kitLines.length) ? "good" : "warn"],

// ---- accent colour ---------------------------------------------------------
function hexToRgb(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || "").trim());
  if (!m) return null;
  const n = parseInt(m[1], 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(r, g, b) { return "#" + [r, g, b].map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0")).join("").toUpperCase(); }
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h = 0, s = 0; const l = (max + min) / 2;
  if (max !== min) {
    const d = max - min;
    s = l > .5 ? d / (2 - max - min) : d / (max + min);
    h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h /= 6;
  }
  return [h, s, l];
}
function hslToRgb(h, s, l) {
  if (!s) return [l * 255, l * 255, l * 255];
  const q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  const f = t => { t = (t + 1) % 1; return t < 1/6 ? p + (q - p) * 6 * t : t < 1/2 ? q : t < 2/3 ? p + (q - p) * (2/3 - t) * 6 : p; };
  return [f(h + 1/3) * 255, f(h) * 255, f(h - 1/3) * 255];
}
function luminance([r, g, b]) {
  const c = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); };
  return .2126 * c(r) + .7152 * c(g) + .0722 * c(b);
}
function contrast(a, b) { const x = luminance(a), y = luminance(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); }
function mixRgb(a, b, t) { return a.map((v, i) => v + (b[i] - v) * t); }
// Keep any picked colour comfortable on the dark UI: tame very bright or
// very dark choices so buttons never glare and never disappear.
function tunedAccent(hex) {
  const rgb = hexToRgb(hex) || hexToRgb(DEFAULT_ACCENT);
  let [h, s, l] = rgbToHsl(...rgb);
  const light = document.documentElement.dataset.theme === "light";
  s = Math.min(s, .78);
  l = light ? Math.min(Math.max(l, .30), .52) : Math.min(Math.max(l, .34), .60);
  return hslToRgb(h, s, l);
}
function applyAccent(hex, persistLocal = true) {
  const valid = hexToRgb(hex) ? String(hex).toUpperCase() : DEFAULT_ACCENT;
  state.accent = valid;
  const rgb = tunedAccent(valid);
  const white = [255, 255, 255], black = [17, 17, 17];
  const ink = contrast(rgb, white) >= contrast(rgb, black) ? "#FFFFFF" : "#111111";
  const light = document.documentElement.dataset.theme === "light";
  const text = light ? mixRgb(rgb, [0, 0, 0], .1) : mixRgb(rgb, white, .45);
  const root = document.documentElement.style;
  const [r, g, b] = rgb.map(Math.round);
  root.setProperty("--accent", rgbToHex(...rgb));
  root.setProperty("--accent-ink", ink);
  root.setProperty("--accent-soft", `rgba(${r},${g},${b},${light ? .10 : .16})`);
  root.setProperty("--accent-line", `rgba(${r},${g},${b},.45)`);
  root.setProperty("--accent-text", rgbToHex(...text));
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", getComputedStyle(document.documentElement).getPropertyValue("--surface").trim() || "#161A1F");
  if (persistLocal) { try { localStorage.setItem("oti_accent", valid); } catch (_) {} }
  broadcastTheme();
}
function themeVars() {
  const cs = getComputedStyle(document.documentElement), out = {};
  ["--bg", "--surface", "--surface-2", "--surface-3", "--line", "--line-2", "--ink", "--ink-2", "--muted",
   "--accent", "--accent-ink", "--accent-soft", "--accent-line", "--accent-text", "--ok", "--warn", "--bad"]
    .forEach(k => out[k] = cs.getPropertyValue(k).trim());
  return out;
}
function broadcastTheme() {
  const msg = { type: "oti-theme", theme: document.documentElement.dataset.theme, vars: themeVars() };
  document.querySelectorAll("iframe").forEach(f => { try { f.contentWindow?.postMessage(msg, location.origin); } catch (_) {} });
}
async function saveAccent(hex) {
  applyAccent(hex);
  if (state.user) state.user.accent_color = state.accent;
  try { await api("/me/preferences", { method: "PUT", body: JSON.stringify({ accent_color: state.accent }) }); }
  catch (e) { toast(e.message, true); }
}

function fmtBytes(n) { n = Number(n || 0); return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
function itemLimit(item) { return Number(item.max_per_order || 0) || 0; }
function freeQty(item) {

function lineProblems(item, qty, variant) {
  const out = [];
  const limit = itemLimit(item);
  const free = variant ? Number(variant.qty_on_hand || 0) : (item.available_qty == null ? Number(item.qty_on_hand || 0) : Number(item.available_qty));
  if (limit && qty > limit) out.push(["bad", `Over the ${limit}-per-order limit`]);
  if (qty > free) out.push([qty > Number(item.qty_on_hand || 0) ? "bad" : "warn", free <= 0 ? "No free stock right now" : `Only ${free} free — may be short`]);
  if (item.inventory_counted === false) out.push(["bad", "Not counted yet"]);
  return out;
}

async function uploadPrintFiles(orderId, files) {
  let failed = 0;
  for (const p of files) {
    try {
      const fd = new FormData();
      fd.append("file", p.file); fd.append("copies", String(p.copies || 1)); fd.append("sides", p.sides);
      fd.append("color_mode", p.color_mode); fd.append("paper", p.paper); fd.append("notes", p.notes || "");
      await api(`/orders/${orderId}/print-files`, { method: "POST", body: fd });
    } catch (e) { failed += 1; toast(`Printout ${p.file.name} didn't upload: ${e.message}`, true); }
  }
  return failed;
}
function addPrintFiles(fileList) {
  const ok = /\.(pdf|docx?)$/i;
  [...(fileList || [])].forEach(file => {
    if (!ok.test(file.name)) { toast(`${file.name}: only PDF or Word files can be printed.`, true); return; }
    if (file.size > 25 * 1024 * 1024) { toast(`${file.name} is over 25 MB.`, true); return; }
    state.printFiles.push({ file, copies: 1, sides: "single", color_mode: "color", paper: "Letter", notes: "" });
  });
  state.printOpen = true;
  render();
}

// ---- bulk add -------------------------------------------------------------------
function parseBulk(text) {
  const byCode = new Map(state.catalog.map(i => [String(i.code).toUpperCase(), i]));
  return String(text || "").split(/\r?\n|;/).map(s => s.trim()).filter(Boolean).map(raw => {
    const tokens = raw.split(/[\s,\t]+/).filter(Boolean);
    let item = null, qty = null;
    for (const t of tokens) {
      const up = t.toUpperCase();
      if (!item && byCode.has(up)) { item = byCode.get(up); continue; }
      if (qty == null && /^\d+$/.test(t)) qty = Number(t);
    }
    if (!item) return { raw, status: "bad", note: "Part # not found" };
    qty = qty || 1;
    if (activeVariants(item).length) return { raw, item, qty, status: "bad", note: "Has colors — add it from the catalog" };
    if (item.inventory_counted === false) return { raw, item, qty, status: "bad", note: "Not counted yet" };
    const max = itemAvailability(item);
    if (max <= 0) return { raw, item, qty, status: "bad", note: "No free stock" };
    if (qty > max) return { raw, item, qty: max, asked: qty, status: "warn", note: `Capped at ${max}` };
    return { raw, item, qty, status: "ok", note: `Add ${qty}` };
  });
}

    <div class="modal-sub">Paste one item per line: part number and quantity, for example <span class="mono">SWAG-PEN-001 50</span>. Commas, tabs and Excel copy-paste work too.</div>

  document.querySelector("#modal-root .modal-card")?.classList.add("wide");
  const ta = document.getElementById("bulk-text"), prev = document.getElementById("bulk-preview"), apply = document.getElementById("bulk-apply");
  let rows = [];
  const update = () => {
    rows = parseBulk(ta.value);
    const good = rows.filter(r => r.status !== "bad");
    prev.innerHTML = rows.length ? `<div class="bulk-preview">${rows.map(r => `<div class="bulk-row ${r.status === "bad" ? "bad" : ""}"><span class="mono">${esc(r.item?.code || r.raw)}</span><span>${esc(r.item?.name || "")}</span><b>${r.item ? "×" + r.qty : ""}</b><span class="st pill ${r.status === "ok" ? "ok" : r.status === "warn" ? "warn" : "bad"}">${esc(r.note)}</span></div>`).join("")}</div>` : "";
    apply.disabled = !good.length;
    apply.textContent = good.length ? `Add ${good.length} item${good.length === 1 ? "" : "s"}` : "Add to order";
  };
  ta.addEventListener("input", update);
  ta.focus();
  document.getElementById("modal-x").onclick = closeModal;
  document.getElementById("bulk-cancel").onclick = closeModal;
  apply.onclick = () => {
    let added = 0;
    rows.filter(r => r.status !== "bad").forEach(r => {
      const max = itemAvailability(r.item);
      const next = Math.min(max, Number(state.cart[r.item.id] || 0) + r.qty);
      state.cart[r.item.id] = next; state.draftQty[r.item.id] = next; added += 1;
    });
    saveCartDraft(); closeModal(); render();
    toast(`${added} item${added === 1 ? "" : "s"} added to your order.`);
  };
}

function orderAgain(orderId) {
  const o = state.myOrders.find(x => x.id === orderId);
  if (!o) return;
  let added = 0; const skipped = [];
  o.lines.forEach(l => {
    const item = state.catalog.find(i => i.id === Number(l.item_id));
    if (!item) { skipped.push(l.item_code); return; }
    if (l.variant_id) {
      const v = (item.variants || []).find(x => Number(x.id) === Number(l.variant_id) && x.active);
      if (!v) { skipped.push(l.item_code); return; }
      state.selectedVariants[item.id] = v.id; state.cartVariants[item.id] = v.id;
    }
    const max = itemAvailability(item);
    const qty = Math.min(max, Number(l.qty_requested || 0));
    if (qty <= 0 || item.inventory_counted === false) { skipped.push(l.item_code); return; }
    state.cart[item.id] = qty; state.draftQty[item.id] = qty; added += 1;
  });

    const k = el.dataset.pfField; p[k] = k === "copies" ? Math.max(1, Math.min(5000, Number(el.value || 1))) : el.value;
  }));
  document.querySelectorAll("[data-pf-rm]").forEach(b => b.addEventListener("click", () => { syncOrderFormFromDom(); state.printFiles.splice(Number(b.dataset.pfRm), 1); render(); }));
  document.getElementById("review-order")?.addEventListener("click", openReview);
  document.getElementById("review-order-mobile")?.addEventListener("click", openReview);
  // orders
  document.querySelectorAll("[data-reorder]").forEach(b => b.addEventListener("click", () => orderAgain(Number(b.dataset.reorder))));
  document.querySelectorAll("[data-print-confirm]").forEach(b => b.addEventListener("click", () => printConfirmation(Number(b.dataset.printConfirm))));
  document.querySelectorAll("[data-add-printout]").forEach(b => b.addEventListener("click", () => openAddPrintout(Number(b.dataset.addPrintout))));
  document.querySelectorAll("[data-pf-del]").forEach(b => b.addEventListener("click", async () => {
    const [oid, fid] = b.dataset.pfDel.split(":").map(Number);
    try { await api(`/orders/${oid}/print-files/${fid}`, { method: "DELETE" }); toast("Printout removed."); await loadMyOrders(); } catch (e) { toast(e.message, true); }
  }));
  // badges
  document.getElementById("badge-scope")?.addEventListener("change", e => { state.badgeScope = e.target.value; try { localStorage.setItem("oti_badge_scope", state.badgeScope); } catch (_) {} render(); });
  // embedded tools get the theme on load
  if (!frameKept) document.querySelectorAll("iframe").forEach(f => f.addEventListener("load", () => setTimeout(broadcastTheme, 50)));
}

// close the profile menu / panels when clicking elsewhere
document.addEventListener("click", (e) => {
  if (state.profileMenuOpen && !e.target.closest("#profile-menu") && !e.target.closest("#profile-btn")) {
    state.profileMenuOpen = false; document.getElementById("profile-menu")?.classList.remove("open");
  }
