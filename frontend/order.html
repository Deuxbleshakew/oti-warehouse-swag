<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oti-Warehouse Swag — Project & Delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#E8E5DC;
    --paper:#1E2124;
    --surface:#282C30;
    --surface2:#31363B;
    --bar:#141618;
    --safety:#F2B705;
    --safety-ink:#3A2E00;
    --rust:#E06248;
    --ok:#6FBF8A;
    --line:#3D4349;
    --muted:#9A958A;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .label{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.08em;
  }
  code, .mono{ font-family:'IBM Plex Mono',monospace; }

  a, button{ font-family:inherit; }
  button{ cursor:pointer; transition:transform .13s ease, background-color .18s ease, border-color .18s ease, opacity .18s ease, box-shadow .18s ease; }
  button:not(:disabled):active{ transform:translateY(1px) scale(.975); }
  a{ transition:color .18s ease, opacity .18s ease; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:3px solid var(--safety);
    outline-offset:1px;
  }

  /* ---- top bar ---- */
  header.bar{
    background:var(--bar);
    color:var(--ink);
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:5px solid var(--safety);
  }
  header.bar .brand{
    font:600 20px/1 'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.04em;
    display:flex;
    align-items:center;
    gap:10px;
  }
  header.bar .brand .crate{ font-size:22px; }
  .build-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    margin-left:7px;
    padding:3px 7px;
    border:1px solid rgba(242,183,5,.55);
    color:var(--safety);
    background:rgba(242,183,5,.09);
    font:500 10px/1 'IBM Plex Mono',monospace;
    letter-spacing:.04em;
    white-space:nowrap;
  }
  header.bar .who{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:13px;
    color:var(--muted);
  }
  header.bar .who .roles{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    background:rgba(242,183,5,.14);
    color:var(--safety);
    padding:2px 7px;
    border-radius:2px;
    letter-spacing:.03em;
  }
  header.bar button.link{
    background:none;
    border:none;
    color:var(--ink);
    text-decoration:underline;
    font-size:13px;
    padding:0;
  }

  /* ---- tabs ---- */
  nav.tabs{
    display:flex;
    gap:2px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:0 20px;
  }
  nav.tabs button{
    transition:color .2s ease, border-color .2s ease, transform .15s ease;
    background:none;
    border:none;
    padding:13px 4px;
    margin-right:22px;
    font:600 13px/1 'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--muted);
    border-bottom:3px solid transparent;
  }
  nav.tabs button.active{
    color:var(--ink);
    border-bottom-color:var(--safety);
  }

  main{
    max-width:1180px;
    margin:0 auto;
    padding:22px 20px 80px;
    display:grid;
    grid-template-columns:1fr 320px;
    gap:24px;
    align-items:start;
  }
  main.setup-only{
    grid-template-columns:minmax(0,760px);
    justify-content:center;
  }
  main.setup-only .slip{
    position:static;
    max-height:none;
    overflow:visible;
  }
  .feature-banner{
    border:1px solid var(--line);
    border-left:5px solid var(--safety);
    background:linear-gradient(135deg,rgba(242,183,5,.10),rgba(49,54,59,.72));
    padding:13px 14px;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
  }
  .feature-banner strong{
    display:block;
    font:600 15px 'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .feature-banner span{
    display:block;
    margin-top:3px;
    color:var(--muted);
    font-size:12px;
    line-height:1.4;
  }
  .feature-banner button{
    flex:0 0 auto;
    background:var(--safety);
    color:var(--safety-ink);
    border:0;
    padding:10px 12px;
    border-radius:var(--radius);
    font:600 12px 'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .setup-empty-warning{
    border:1px dashed var(--rust);
    background:rgba(224,98,72,.07);
    color:var(--ink);
    padding:10px 11px;
    font-size:12px;
    line-height:1.4;
  }
  @media (max-width:880px){
    main{ grid-template-columns:1fr; }
    .slip{ position:static; max-height:none; overflow:visible; }
  }

  .toolbar{
    display:flex;
    gap:10px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .toolbar input[type=search], .toolbar select{
    padding:9px 11px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--surface2);
    font-size:13px;
    color:var(--ink);
  }
  .toolbar input[type=search]{ flex:1; min-width:180px; }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:14px;
  }

  /* ---- item tag card ---- */
  .tag{
    background:var(--surface);
    transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    border:1px solid var(--line);
    border-radius:var(--radius);
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .tag:hover{ transform:translateY(-3px); border-color:#596168; box-shadow:0 10px 24px rgba(0,0,0,.22); }
  .tag:focus-within{ border-color:var(--safety); }
  .tag .perf{
    height:0;
    border-top:2px dashed var(--line);
    margin:0 14px;
    position:relative;
    top:14px;
  }
  .tag .photo{
    height:120px;
    background:var(--surface2);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--line);
    border-bottom:1px solid var(--line);
  }
  .tag .photo img{ width:100%; height:100%; object-fit:cover; cursor:zoom-in; transition:transform .25s ease, opacity .2s ease; }
  .tag:hover .photo img{ transform:scale(1.025); }
  .tag .colordot{
    position:absolute;
    top:8px;
    right:8px;
    width:16px;
    height:16px;
    border-radius:50%;
    border:2px solid var(--ink);
    box-shadow:0 0 0 2px var(--bar);
  }
  .cat-section{ margin-bottom:22px; }
  .cat-head{
    font:600 13px 'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--safety);
    border-bottom:1px solid var(--line);
    padding-bottom:6px;
    margin-bottom:12px;
    display:flex;
    justify-content:space-between;
  }
  .cat-head .n{ color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:11px; }
  .tag .body{ padding:12px 14px 14px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .tag .code{
    font-size:11px;
    color:var(--muted);
    letter-spacing:.03em;
  }
  .tag .name{ font-weight:600; font-size:14.5px; line-height:1.3; }
  .tag .meta{ font-size:12px; color:var(--muted); }
  .tag .row-bottom{
    margin-top:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .tag .stock{
    font-size:11px;
    font-family:'IBM Plex Mono',monospace;
  }
  .tag .stock.low{ color:var(--rust); }
  .tag .stepper{
    display:flex;
    align-items:center;
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .tag .stepper button{
    background:var(--surface2);
    color:var(--ink);
    border:none;
    width:26px;
    height:26px;
    font-size:15px;
    line-height:1;
  }
  .tag .stepper button:disabled{ opacity:.35; cursor:not-allowed; }
  .tag .stepper .qty{
    width:42px;
    height:26px;
    border:0;
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    padding:0 3px;
    -moz-appearance:textfield;
  }
  .tag .stepper .qty::-webkit-outer-spin-button,
  .tag .stepper .qty::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .tag .photo-fallback{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:100%;
    font-size:28px;
    opacity:.5;
  }
  .card-actions{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:4px; }
  .estimated-mark{ display:flex; align-items:center; gap:5px; color:var(--muted); font-size:10.5px; }
  .estimated-mark input{ accent-color:var(--safety); }
  .request-count{ background:none; border:1px solid var(--line); color:var(--muted); padding:5px 7px; border-radius:var(--radius); font-size:10px; }
  .request-count:hover{ color:var(--ink); border-color:var(--safety); }

  /* ---- order slip (cart) ---- */
  .slip{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    position:sticky;
    top:20px;
    max-height:calc(100vh - 40px);
    overflow-y:auto;
  }
  .slip .slip-head{
    padding:14px 16px 10px;
    border-bottom:2px dashed var(--line);
  }
  .slip .slip-head .label{ font-size:12px; color:var(--muted); }
  .slip .slip-head h2{
    margin:2px 0 0;
    font:600 18px 'Oswald',sans-serif;
    text-transform:uppercase;
  }
  .slip .lines{ padding:10px 16px; display:flex; flex-direction:column; gap:8px; max-height:280px; overflow-y:auto; }
  .slip .empty{ color:var(--muted); font-size:13px; padding:8px 0; }
  .slip .line{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    gap:8px;
  }
  .slip .line .nm{ flex:1; }
  .slip .line .nm .cd{ display:block; font-size:10.5px; color:var(--muted); font-family:'IBM Plex Mono',monospace; }
  .slip .line button.rm{
    background:none;
    border:none;
    color:var(--rust);
    font-size:16px;
    padding:0 2px;
  }
  .slip .foot{ padding:12px 16px 16px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:10px; }
  .slip select, .slip textarea, .slip input[type=text],
  .slip input[type=date], .slip input[type=number]{
    width:100%;
    padding:8px 9px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--surface2);
    color:var(--ink);
    font-size:13px;
    font-family:inherit;
  }
  .slip textarea{ min-height:52px; resize:vertical; }
  .project-builder{
    border:1px solid var(--line);
    background:rgba(20,22,24,.32);
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .slip .mini-label{
    display:block;
    color:var(--muted);
    font-size:10.5px;
    margin-bottom:4px;
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  .project-builder .two-col{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .project-builder .save-project{
    display:flex;
    align-items:flex-start;
    gap:8px;
    color:var(--muted);
    font-size:11.5px;
    line-height:1.35;
  }
  .project-builder .save-project input{
    width:auto;
    margin-top:2px;
    accent-color:var(--safety);
  }
  .project-help{
    color:var(--muted);
    font-size:11px;
    line-height:1.35;
  }
  .address-box{
    border-top:1px dashed var(--line);
    margin-top:2px;
    padding-top:9px;
  }
  .address-box h3{
    margin:0 0 8px;
    font:600 13px 'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .shipping-plan{
    border:1px solid var(--line);
    border-left:4px solid var(--safety);
    background:var(--surface2);
    padding:9px 10px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px 10px;
  }
  .shipping-plan .plan-item span{
    display:block;
    color:var(--muted);
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .shipping-plan .plan-item strong{
    display:block;
    margin-top:2px;
    font:600 12px 'IBM Plex Mono',monospace;
  }
  .shipping-plan .plan-wide{ grid-column:1 / -1; }
  .shipping-plan.due{ border-left-color:var(--rust); }
  .shipping-note{
    grid-column:1 / -1;
    color:var(--muted);
    font-size:10px;
    line-height:1.35;
  }
  .map-reference summary{
    cursor:pointer;
    color:var(--muted);
    font-size:10.5px;
  }
  .map-reference img{
    display:block;
    width:100%;
    margin-top:7px;
    border:1px solid var(--line);
    background:#000;
  }
  .saved-project-card{
    border:1px solid var(--line);
    background:var(--surface2);
    padding:9px;
    font-size:11px;
    line-height:1.5;
  }
  .saved-project-card strong{ color:var(--ink); }
  .btn-primary{
    background:var(--safety);
    color:var(--safety-ink);
    border:none;
    padding:11px;
    border-radius:var(--radius);
    font:600 13px 'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  .btn-primary:disabled{ opacity:.4; cursor:not-allowed; }
  .total-count{ font-size:12px; color:var(--muted); }

  /* ---- toast ---- */
  #toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translate(-50%,18px);
    background:var(--bar);
    color:var(--ink);
    padding:12px 18px;
    border-radius:var(--radius);
    border-left:4px solid var(--safety);
    font-size:13px;
    max-width:420px;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .22s ease, transform .22s ease, visibility .22s;
    z-index:80;
  }
  #toast.show{ opacity:1; visibility:visible; transform:translate(-50%,0); }
  #toast.err{ border-left-color:var(--rust); }

  /* ---- orders tab ---- */
  .orders-list{ display:flex; flex-direction:column; gap:10px; }
  .order-card{
    background:var(--surface);
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .order-card:hover{ transform:translateY(-2px); border-color:#596168; box-shadow:0 8px 20px rgba(0,0,0,.16); }
  .order-card.incomplete{ border-left:4px solid var(--rust); }
  .order-card .top-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .order-card .oid{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); }
  .order-card .proj{ font-size:13px; color:var(--muted); margin-top:2px; }
  .order-card .proj-meta{ font-size:11.5px; color:var(--muted); margin-top:3px; }
  .stamp{
    font:700 11px 'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.06em;
    padding:4px 9px;
    border:2px solid currentColor;
    border-radius:2px;
    transform:rotate(-2deg);
    white-space:nowrap;
  }
  .stamp.pending{ color:var(--muted); }
  .stamp.approved{ color:var(--ok); }
  .stamp.picking{ color:var(--safety); }
  .stamp.rejected{ color:var(--rust); }
  .stamp.fulfilled{ color:var(--ink); }
  .order-card .lines-mini{ margin-top:10px; font-size:12.5px; color:var(--ink); }
  .order-card .lines-mini div{ display:flex; justify-content:space-between; padding:2px 0; border-bottom:1px dotted var(--line); }
  .order-card .lines-mini div:last-child{ border-bottom:none; }
  .order-card .notes{ margin-top:8px; font-size:12.5px; color:var(--muted); font-style:italic; }
  .incomplete-note{ margin-top:8px; padding:7px 9px; border:1px dashed var(--rust); color:var(--rust); font-size:11.5px; background:rgba(224,98,72,.06); }
  .order-actions{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .btn-secondary{ background:var(--surface2); color:var(--ink); border:1px solid var(--line); padding:8px 10px; border-radius:var(--radius); font:600 11px 'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.04em; }
  .estimate-pill{ color:var(--safety); font-size:9px; border:1px solid rgba(242,183,5,.45); padding:1px 4px; margin-left:5px; }
  .tracking-box{ margin-top:10px; border-top:1px dashed var(--line); padding-top:9px; font-size:12px; }
  .proof-strip{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .proof-strip img{ width:88px; height:70px; object-fit:cover; border:1px solid var(--line); cursor:zoom-in; transition:transform .18s ease, border-color .18s ease; }
  .proof-strip img:hover{ transform:translateY(-2px); border-color:var(--safety); }
  .proof-strip img:not([src]){ opacity:.45; background:var(--surface2); }

  /* ---- login screen ---- */
  .login-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .login-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    width:340px;
    max-width:100%;
    padding:26px 24px 24px;
  }
  .login-card .brand{
    font:600 22px 'Oswald',sans-serif;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:4px;
  }
  .login-card .sub{ font-size:12.5px; color:var(--muted); margin-bottom:20px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:5px; }
  .field input{
    width:100%;
    padding:10px 11px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--surface2);
    color:var(--ink);
    font-size:14px;
  }
  .server-field input{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--surface2);
    color:var(--ink);
    font-size:12.5px;
  }
  .err-line{ color:var(--rust); font-size:12.5px; margin:-6px 0 14px; }
  .server-toggle{
    font-size:11.5px;
    color:var(--muted);
    background:none;
    border:none;
    text-decoration:underline;
    padding:0;
    margin-top:14px;
  }
  .server-field{ margin-top:10px; }

  .loading, .empty-state{
    color:var(--muted);
    font-size:13px;
    padding:30px 4px;
    text-align:center;
  }
  .spinner{ width:28px; height:28px; margin:0 auto 9px; border:3px solid var(--line); border-top-color:var(--safety); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .view-panel{ animation:viewIn .22s ease both; }
  @keyframes viewIn{ from{ opacity:0; transform:translateY(5px); } to{ opacity:1; transform:none; } }
  .computed-field{ min-height:36px; padding:8px 9px; border:1px solid var(--line); background:var(--paper); color:var(--ink); font:500 12px 'IBM Plex Mono',monospace; display:flex; align-items:center; }
  .modal-backdrop, .lightbox{
    position:fixed; inset:0; background:rgba(5,6,7,.82); z-index:70;
    display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; visibility:hidden; transition:opacity .2s ease, visibility .2s;
  }
  .modal-backdrop.open, .lightbox.open{ opacity:1; visibility:visible; }
  .modal-card{ width:min(600px,100%); max-height:90vh; overflow:auto; background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--safety); padding:18px; transform:translateY(10px) scale(.985); transition:transform .2s ease; box-shadow:0 24px 70px rgba(0,0,0,.45); }
  .modal-backdrop.open .modal-card{ transform:none; }
  .modal-card h2{ margin:0 0 4px; font:600 18px 'Oswald',sans-serif; text-transform:uppercase; }
  .modal-card .modal-sub{ color:var(--muted); font-size:12px; margin-bottom:14px; }
  .modal-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }

  .modal-card textarea{ min-height:70px; resize:vertical; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .edit-line{ display:grid; grid-template-columns:1fr 90px 110px; gap:8px; align-items:center; padding:7px 0; border-bottom:1px dotted var(--line); font-size:12px; }

  .lightbox img{ max-width:min(1100px,94vw); max-height:88vh; object-fit:contain; border:1px solid var(--line); box-shadow:0 20px 70px rgba(0,0,0,.55); transform:scale(.97); transition:transform .2s ease; }

  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{ animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; scroll-behavior:auto!important; } }

  /* Phone-width tap targets. Placed at the END of the stylesheet on
     purpose: CSS gives later same-specificity rules priority over
     earlier ones regardless of media query — put this anywhere else and
     the base desktop rules above would silently win even when this
     query matches. The compact desktop sizing (26px stepper buttons,
     etc.) is comfortable with a mouse but genuinely hard to hit
     accurately with a thumb, so this bumps touch targets to the
     standard ~44px comfort size without touching desktop at all. */
  @media (max-width:480px){
    .tag .stepper button{ width:44px; height:44px; font-size:19px; }
    .tag .stepper .qty{ width:52px; height:44px; font-size:16px; }
    .field input, .server-field input{ padding:13px 12px; font-size:16px; }
    .toolbar input[type=search], .toolbar select{ padding:12px 12px; font-size:16px; }
    .slip select, .slip textarea, .slip input[type=text],

    .project-builder .two-col{ grid-template-columns:1fr; }
    .shipping-plan{ grid-template-columns:1fr; }
    .shipping-plan .plan-wide, .shipping-note{ grid-column:1; }
    .slip .line button.rm{ font-size:20px; padding:8px 10px; }
    .btn-primary{ padding:14px; }
    nav.tabs button{
    transition:color .2s ease, border-color .2s ease, transform .15s ease; padding:15px 4px; margin-right:12px; }
    .feature-banner{ align-items:stretch; flex-direction:column; }
    .feature-banner button{ width:100%; padding:13px; }
    .modal-grid{ grid-template-columns:1fr; }
    .edit-line{ grid-template-columns:1fr 76px; }
    .edit-line .estimated-edit{ grid-column:1 / -1; }
  }
</style>
</head>
<body>

<div id="app"></div>
<div id="toast"></div>
<div id="modal-root" class="modal-backdrop" aria-hidden="true"></div>
<div id="lightbox" class="lightbox" aria-hidden="true"><button class="lightbox-close" aria-label="Close">✕</button><img alt="Expanded item photo"></div>

<script>
/* ---------------------------------------------------------------------
   Oti-Warehouse Swag — ordering frontend.
   Static file, no build step — open it from the shared drive or host it
   next to the backend. Talks to the FastAPI backend over bearer-token
   auth (see backend/main.py for the CORS rationale).
   ------------------------------------------------------------------- */

// When this page is served BY the backend itself (Render, or any host
// running main.py), talking to "itself" is exactly right — no manual
// server address needed at all, which matters most on a phone where
// typing a URL into a settings field is annoying. Opening the file
// directly (file://) has no real origin to detect, so that case keeps
// the old localhost default for local testing.
const APP_VERSION = "5.7";
const DEFAULT_API_BASE =
  (location.protocol === "file:" || !location.origin || location.origin === "null")
    ? "http://localhost:8000"
    : location.origin;

// Conservative state-level defaults transcribed from the supplied UPS Ground
// outbound map. Several states contain more than one ZIP-level zone, so the
// transit time is locked to the supplied UPS state map.
const GROUND_DAYS_BY_STATE = {
  CT:1, DC:1, DE:1, MA:1, MD:1, NJ:1, NY:1, PA:1, RI:1, VT:1,
  GA:2, IN:2, KY:2, ME:2, MI:2, NC:2, NH:2, OH:2, SC:2, TN:2, VA:2, WV:2,
  AL:3, AR:3, AZ:3, FL:3, IA:3, IL:3, KS:3, LA:3, MN:3, MO:3, MS:3, NE:3, NM:3, WI:3,
  CO:4, MT:4, ND:4, OK:4, SD:4, TX:4,
  AK:5, CA:5, HI:5, ID:5, NV:5, OR:5, PR:5, UT:5, VI:5, WA:5, WY:5,
};
const US_STATES = [
  ["AL","Alabama"],["AK","Alaska"],["AZ","Arizona"],["AR","Arkansas"],
  ["CA","California"],["CO","Colorado"],["CT","Connecticut"],["DE","Delaware"],
  ["DC","District of Columbia"],["FL","Florida"],["GA","Georgia"],["HI","Hawaii"],
  ["ID","Idaho"],["IL","Illinois"],["IN","Indiana"],["IA","Iowa"],
  ["KS","Kansas"],["KY","Kentucky"],["LA","Louisiana"],["ME","Maine"],
  ["MD","Maryland"],["MA","Massachusetts"],["MI","Michigan"],["MN","Minnesota"],
  ["MS","Mississippi"],["MO","Missouri"],["MT","Montana"],["NE","Nebraska"],
  ["NV","Nevada"],["NH","New Hampshire"],["NJ","New Jersey"],["NM","New Mexico"],
  ["NY","New York"],["NC","North Carolina"],["ND","North Dakota"],["OH","Ohio"],
  ["OK","Oklahoma"],["OR","Oregon"],["PA","Pennsylvania"],["PR","Puerto Rico"],
  ["RI","Rhode Island"],["SC","South Carolina"],["SD","South Dakota"],["TN","Tennessee"],
  ["TX","Texas"],["UT","Utah"],["VT","Vermont"],["VA","Virginia"],
  ["VI","U.S. Virgin Islands"],["WA","Washington"],["WV","West Virginia"],
  ["WI","Wisconsin"],["WY","Wyoming"],
];

function parseIsoDate(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(value || "")) return null;
  const [y,m,d] = value.split("-").map(Number);
  const result = new Date(y, m - 1, d, 12, 0, 0);
  return result.getFullYear() === y && result.getMonth() === m - 1 && result.getDate() === d ? result : null;
}
function isoFromDate(value) {
  const y = value.getFullYear();
  const m = String(value.getMonth() + 1).padStart(2, "0");
  const d = String(value.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}
function observedFixed(year, monthIndex, day) {
  const d = new Date(year, monthIndex, day, 12);
  if (d.getDay() === 6) d.setDate(d.getDate() - 1);
  else if (d.getDay() === 0) d.setDate(d.getDate() + 1);
  return d;
}
function nthWeekday(year, monthIndex, weekday, n) {
  const d = new Date(year, monthIndex, 1, 12);
  d.setDate(1 + ((weekday - d.getDay() + 7) % 7) + (n - 1) * 7);
  return d;
}
function lastWeekday(year, monthIndex, weekday) {
  const d = new Date(year, monthIndex + 1, 0, 12);
  d.setDate(d.getDate() - ((d.getDay() - weekday + 7) % 7));
  return d;
}
function federalHolidaySet(year) {
  return new Set([
    observedFixed(year,0,1), nthWeekday(year,0,1,3), nthWeekday(year,1,1,3),
    lastWeekday(year,4,1), observedFixed(year,5,19), observedFixed(year,6,4),
    nthWeekday(year,8,1,1), nthWeekday(year,9,1,2), observedFixed(year,10,11),
    nthWeekday(year,10,4,4), observedFixed(year,11,25),
  ].map(isoFromDate));
}
function isBusinessDate(value) {
  if (value.getDay() === 0 || value.getDay() === 6) return false;
  const iso = isoFromDate(value);
  for (const y of [value.getFullYear()-1, value.getFullYear(), value.getFullYear()+1]) {
    if (federalHolidaySet(y).has(iso)) return false;
  }
  return true;
}
function previousBusinessDate(value) {
  const d = new Date(value);
  do { d.setDate(d.getDate() - 1); } while (!isBusinessDate(d));
  return d;
}
function subtractBusinessDates(value, count) {
  const d = new Date(value);
  let left = Number(count) || 0;
  while (left > 0) {
    d.setDate(d.getDate() - 1);
    if (isBusinessDate(d)) left -= 1;
  }
  return d;
}
function shippingPlanForForm(form) {
  const event = parseIsoDate(form.eventDate);
  const stateCode = (form.shippingState || "").toUpperCase();
  const days = GROUND_DAYS_BY_STATE[stateCode];
  if (!event || !days) return null;
  const delivery = previousBusinessDate(event);
  const shipBy = subtractBusinessDates(delivery, days);
  return { deliveryDate: isoFromDate(delivery), shipByDate: isoFromDate(shipBy), days };
}
function stateOptions(selected) {
  return `<option value="">Select state</option>` + US_STATES.map(([code,name]) =>
    `<option value="${code}" ${selected === code ? "selected" : ""}>${name}</option>`).join("");
}
function formattedAddress(project) {
  if (!project) return "";
  const street = [project.shipping_address1, project.shipping_address2].filter(Boolean).join(", ");
  const cityLine = [project.shipping_city, project.shipping_state, project.shipping_postal_code].filter(Boolean).join(" ");
  return [street, cityLine].filter(Boolean).join(" · ");
}

const state = {
  apiBase: sessionStorage.getItem("oti_api_base") || DEFAULT_API_BASE,
  token: sessionStorage.getItem("oti_token") || null,
  user: null,
  tab: "catalog",
  catalog: [],
  projects: [],
  cart: {},           // item_id -> qty
  estimated: {},      // item_id -> quantity is still an estimate
  orderForm: {
    projectChoice: "new",
    projectName: "",
    projectOwner: "",
    eventDate: "",
    projectLocation: "",
    shippingAddress1: "",
    shippingAddress2: "",
    shippingCity: "",
    shippingState: "",
    shippingPostalCode: "",
    attendees: "",
    projectDescription: "",
    saveProject: false,
    notes: "",
  },
  myOrders: [],
  proofUrls: {},       // proof photo id -> authenticated object URL
  search: "",
  category: "",
  sort: "name",
  loadingCatalog: false,
  loadingOrders: false,
  loginError: "",
  showServerField: false,
  polling: false,
  lastPollTime: null,
};

let pollAbort = null;

// ---- fetch helper --------------------------------------------------------
async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  if (opts.body) headers["Content-Type"] = "application/json";
  if (state.token) headers["Authorization"] = "Bearer " + state.token;

  let res;
  try {
    res = await fetch(state.apiBase + path, Object.assign({}, opts, { headers }));
  } catch (e) {
    throw new Error("Couldn't reach the server at " + state.apiBase + ". Check the server address and that the backend is running.");
  }

  if (res.status === 401) {
    logout("Your session expired. Log in again.");
    throw new Error("Session expired.");
  }

  if (!res.ok) {
    let detail = "Request failed (" + res.status + ").";
    try {
      const body = await res.json();
      if (body && body.detail) detail = typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail);
    } catch (_) {}
    throw new Error(detail);
  }
  if (res.status === 204) return null;
  return res.json();
}

function saveSession() {
  if (state.token) sessionStorage.setItem("oti_token", state.token);
  sessionStorage.setItem("oti_api_base", state.apiBase);
}

function blankOrderForm() {
  return {
    projectChoice: "new",
    projectName: "",
    projectOwner: state.user ? (state.user.full_name || state.user.username || "") : "",
    eventDate: "",
    projectLocation: "",
    shippingAddress1: "",
    shippingAddress2: "",
    shippingCity: "",
    shippingState: "",
    shippingPostalCode: "",
    attendees: "",
    projectDescription: "",
    saveProject: false,
    notes: "",
  };
}

function logout(message) {
  stopPolling();
  state.token = null;
  state.user = null;
  state.cart = {};
  state.estimated = {};
  state.orderForm = blankOrderForm();
  state.myOrders = [];
  Object.values(state.proofUrls).forEach(url => URL.revokeObjectURL(url));
  state.proofUrls = {};
  sessionStorage.removeItem("oti_token");
  state.loginError = message || "";
  render();
}

// ---- toast ----------------------------------------------------------------
let toastTimer = null;
function toast(message, isErr) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.className = (isErr ? "err " : "") + "show";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove("show"); }, 4200);
}

function loadingMarkup(label) {
  return `<div class="loading"><div class="spinner" aria-hidden="true"></div>${esc(label)}</div>`;
}

function renderWithTransition() {
  if (document.startViewTransition) document.startViewTransition(() => render());
  else render();
}

function openLightbox(src, alt) {
  const box = document.getElementById("lightbox");
  const img = box.querySelector("img");
  img.src = src;
  img.alt = alt || "Expanded photo";
  box.classList.add("open");
  box.setAttribute("aria-hidden", "false");
}
function closeLightbox() {
  const box = document.getElementById("lightbox");
  box.classList.remove("open");
  box.setAttribute("aria-hidden", "true");
}
function openModal(html) {
  const root = document.getElementById("modal-root");
  root.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true">${html}</div>`;
  root.classList.add("open");
  root.setAttribute("aria-hidden", "false");
}
function closeModal() {
  const root = document.getElementById("modal-root");
  root.classList.remove("open");
  root.setAttribute("aria-hidden", "true");
  setTimeout(() => { if (!root.classList.contains("open")) root.innerHTML = ""; }, 210);
}

async function loadProtectedProofImages() {
  const pending = [...document.querySelectorAll("img[data-proof-id]")];
  await Promise.all(pending.map(async img => {
    const id = Number(img.dataset.proofId);
    if (state.proofUrls[id]) {
      img.src = state.proofUrls[id];
      img.dataset.lightboxSrc = state.proofUrls[id];
      return;
    }
    try {
      const res = await fetch(state.apiBase + "/order-proof/" + id, {
        headers: { "Authorization": "Bearer " + state.token },
      });
      if (!res.ok) throw new Error("Proof photo failed to load.");
      const url = URL.createObjectURL(await res.blob());
      state.proofUrls[id] = url;
      if (img.isConnected) {
        img.src = url;
        img.dataset.lightboxSrc = url;
      }
    } catch (_) {
      if (img.isConnected) img.alt = "Proof photo unavailable";
    }
  }));
}

// ---- data loading -----------------------------------------------------------
async function loadCatalog() {
  state.loadingCatalog = true; render();
  try {
    const [items, projects] = await Promise.all([
      api("/catalog"),
      api("/projects"),
    ]);
    state.catalog = items;
    state.projects = projects;
  } catch (e) {
    toast(e.message, true);
  } finally {
    state.loadingCatalog = false; render();
  }
}

async function loadMyOrders() {
  state.loadingOrders = true; render();
  try {
    const orders = await api("/orders/my");
    state.myOrders = orders;
    state.lastPollTime = new Date().toISOString();
  } catch (e) {
    toast(e.message, true);
  } finally {
    state.loadingOrders = false; render();
  }
}

function stopPolling() {
  state.polling = false;
  if (pollAbort) pollAbort.aborted = true;
}

async function pollLoop() {
  if (state.polling) return;
  state.polling = true;
  const myGate = { aborted: false };
  pollAbort = myGate;
  while (!myGate.aborted && state.token) {
    try {
      const since = encodeURIComponent(state.lastPollTime || new Date().toISOString());
      const res = await api("/orders/updates?since=" + since);
      if (myGate.aborted) break;
      state.lastPollTime = res.server_time;
      if (res.orders && res.orders.length) {
        const byId = Object.fromEntries(state.myOrders.map(o => [o.id, o]));
        res.orders.forEach(o => { byId[o.id] = o; });
        state.myOrders = Object.values(byId).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        if (state.tab === "orders") render();
        res.orders.forEach(o => {
          toast("Order #" + o.id + " is now " + o.status + ".");
        });
      }
    } catch (e) {
      if (myGate.aborted) break;
      await new Promise(r => setTimeout(r, 4000));
    }
  }
}

// ---- cart -------------------------------------------------------------------
function cartCount() {
  return Object.values(state.cart).reduce((a, b) => a + b, 0);
}
function setQty(itemId, qty, max) {
  qty = Number.isFinite(Number(qty)) ? Math.floor(Number(qty)) : 0;
  qty = Math.max(0, Math.min(qty, max));
  if (qty === 0) { delete state.cart[itemId]; delete state.estimated[itemId]; }
  else state.cart[itemId] = qty;
  render();
}

function buildProjectPayload() {
  const f = state.orderForm;
  if (f.projectChoice === "none") return {};
  if (f.projectChoice.startsWith("saved:")) {
    return { project_id: Number(f.projectChoice.split(":", 2)[1]) };
  }
  if (!f.projectName.trim()) throw new Error("Enter a project or event name for this order.");
  if (!f.eventDate) throw new Error("Enter the event date.");
  const plan = shippingPlanForForm(f);
  const attendees = f.attendees === "" ? null : Number(f.attendees);
  if (attendees != null && (!Number.isInteger(attendees) || attendees < 0)) {
    throw new Error("Attendees must be a whole number of zero or more.");
  }
  return {
    new_project: {
      name: f.projectName.trim(), owner: f.projectOwner.trim(),
      event_date: f.eventDate,
      delivery_date: plan ? plan.deliveryDate : "",
      ship_by_date: plan ? plan.shipByDate : "",
      location: f.projectLocation.trim(),
      shipping_address1: f.shippingAddress1.trim(),
      shipping_address2: f.shippingAddress2.trim(),
      shipping_city: f.shippingCity.trim(),
      shipping_state: f.shippingState,
      shipping_postal_code: f.shippingPostalCode.trim(),
      shipping_service: "UPS Ground",
      ups_ground_days: plan ? plan.days : null,
      attendees, description: f.projectDescription.trim(),
    },
    save_project: Boolean(f.saveProject),
  };
}

async function submitOrder() {
  const lines = Object.entries(state.cart).map(([item_id, qty]) => ({
    item_id: Number(item_id), qty, estimated: Boolean(state.estimated[item_id])
  }));
  if (!lines.length) return;
  let projectPayload;
  try {
    projectPayload = buildProjectPayload();
  } catch (e) {
    toast(e.message, true);
    return;
  }
  try {
    const order = await api("/orders", {
      method: "POST",
      body: JSON.stringify(Object.assign({
        notes: state.orderForm.notes.trim(),
        lines,
      }, projectPayload)),
    });
    const savedForReuse = Boolean(projectPayload.save_project);
    state.cart = {};
    state.estimated = {};
    state.orderForm = blankOrderForm();
    if (savedForReuse) {
      try { state.projects = await api("/projects"); } catch (_) {}
    }
    toast("Order #" + order.id + " submitted — pending approval.");
    state.tab = "orders";
    await loadMyOrders();
  } catch (e) {
    toast(e.message, true);
    render();
  }
}

// ---- auth -------------------------------------------------------------------
async function doLogin(username, password) {
  state.loginError = "";
  try {
    const res = await fetch(state.apiBase + "/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || "Invalid username or password.");
    }
    const data = await res.json();
    state.token = data.token;
    state.user = data.user;
    state.orderForm = blankOrderForm();
    saveSession();
    await Promise.all([loadCatalog(), loadMyOrders()]);
    pollLoop();
  } catch (e) {
    state.loginError = e.message.includes("fetch") || e.message.includes("reach")
      ? "Couldn't reach the server at " + state.apiBase + ". Check the server address."
      : e.message;
  }
  render();
}

// ---- rendering ----------------------------------------------------------------
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

function imgUrl(item) {
  if (!item.images || !item.images.length) return null;
  // The item endpoint skips stale legacy records and serves the first photo
  // whose bytes still exist, including DB-backed uploads.
  return state.apiBase + "/catalog/" + encodeURIComponent(item.id) + "/image";
}

function handleImageError(img) {
  const holder = img && img.closest ? img.closest(".photo") : null;
  if (!holder) return;
  img.remove();
  if (!holder.querySelector(".photo-fallback")) {
    const fallback = document.createElement("span");
    fallback.className = "photo-fallback";
    fallback.textContent = "📦";
    fallback.title = "Photo file is missing from the server";
    holder.prepend(fallback);
  }
}

function renderLogin() {
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand"><span>📦</span> Oti-Warehouse Swag <span class="build-badge">v${APP_VERSION} WORKFLOW</span></div>
      <div class="sub">Sign in to browse the catalog and place an order.</div>
      <form id="login-form">
        <div class="field">
          <label for="f-user">Username</label>
          <input id="f-user" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="f-pass">Password</label>
          <input id="f-pass" name="password" type="password" autocomplete="current-password" required>
        </div>
        ${state.loginError ? `<div class="err-line">${esc(state.loginError)}</div>` : ""}
        <button class="btn-primary" style="width:100%" type="submit">Log in</button>
      </form>
      <button class="server-toggle" id="toggle-server">${state.showServerField ? "Hide" : "Change"} server address</button>
      ${state.showServerField ? `
        <div class="server-field">
          <input id="f-server" value="${esc(state.apiBase)}" placeholder="http://192.168.1.20:8000">
        </div>
      ` : ""}
    </div>
  </div>`;
}

function renderTagCard(item) {
  const inCart = state.cart[item.id] || 0;
  const out = item.qty_on_hand <= 0;
  const low = item.qty_on_hand > 0 && item.qty_on_hand <= item.reorder_threshold;
  const photo = imgUrl(item);
  return `
  <div class="tag">
    <div class="photo">${photo ? `<img src="${esc(photo)}" alt="${esc(item.name)}" loading="lazy" data-lightbox-src="${esc(photo)}" onerror="handleImageError(this)">` : `<span class="photo-fallback">📦</span>`}${item.color ? `<span class="colordot" style="background:${esc(item.color)}" title="${esc(item.color_name || item.color)}"></span>` : ""}</div>
    <div class="perf"></div>
    <div class="body">
      <div class="code mono">${esc(item.code)}</div>
      <div class="name">${esc(item.name)}</div>
      <div class="meta">${[item.category, item.measures].filter(Boolean).map(esc).join(" · ")}</div>
      <div class="row-bottom">

function filteredCatalog() {
  const q = state.search.trim().toLowerCase();
  const items = state.catalog.filter(i => {
    if (state.category && i.category !== state.category) return false;
    if (!q) return true;
    return (i.name + " " + i.code + " " + i.description).toLowerCase().includes(q);
  });
  const by = state.sort;
  items.sort((a, b) => {
    if (by === "code") return a.code.localeCompare(b.code);
    if (by === "stock") return a.qty_on_hand - b.qty_on_hand;
    return a.name.localeCompare(b.name);
  });
  return items;
}

function groupByCategory(items) {
  const groups = new Map();
  items.forEach(i => {
    const key = i.category || "Uncategorized";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(i);
  });
  return [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0]));
}

function renderCatalogTab() {
  const items = filteredCatalog();
  const categories = [...new Set(state.catalog.map(i => i.category).filter(Boolean))];
  let body;
  if (state.loadingCatalog) {
    body = loadingMarkup("Loading catalog…");
  } else if (!items.length) {
    body = `<div class="empty-state">No items match. Try clearing the search or category filter.</div>`;
  } else if (state.category) {
    // a single category is already one section — plain grid, no headers
    body = `<div class="grid">${items.map(renderTagCard).join("")}</div>`;
  } else {
    body = groupByCategory(items).map(([cat, list]) => `
      <div class="cat-section">
        <div class="cat-head"><span>${esc(cat)}</span><span class="n">${list.length} item${list.length === 1 ? "" : "s"}</span></div>
        <div class="grid">${list.map(renderTagCard).join("")}</div>

  }
  return `

        <option value="name" ${state.sort === "name" ? "selected" : ""}>Sort: Name</option>

async function submitCountRequest(itemId, itemName) {
  openModal(`
    <h2>Request Count</h2>
    <div class="modal-sub">Flag ${esc(itemName)} for a physical recount. Add a note only when useful.</div>
    <label for="count-note">Optional note</label>
    <textarea id="count-note" maxlength="255" placeholder="Example: looks low, discrepancy, or last count is old"></textarea>
    <div id="count-error" class="err-line" style="margin:8px 0 0;"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="count-cancel">Cancel</button>
      <button class="btn-primary" id="count-submit">Send Request</button>
    </div>`);
  document.getElementById("count-cancel").onclick = closeModal;
  document.getElementById("count-submit").onclick = async () => {
    const button = document.getElementById("count-submit");
    button.disabled = true;
    button.textContent = "Sending…";
    try {
      await api(`/catalog/${itemId}/count-requests`, {
        method: "POST",
        body: JSON.stringify({ note: document.getElementById("count-note").value.trim() }),
      });
      closeModal();

    } catch (e) {
      document.getElementById("count-error").textContent = e.message;
      button.disabled = false;
      button.textContent = "Send Request";
    }
  };
}

      <div><label>Estimated attendees</label><input id="edit-attendees" type="number" min="0" step="1" value="${p.attendees == null ? "" : p.attendees}"></div>
    </div>

    document.getElementById("edit-transit").textContent = days ? `${days} business day${days === 1 ? "" : "s"} · automatic` : "State pending";
  };

    const error = document.getElementById("edit-error");
    const lines = [];
    try {
      document.querySelectorAll(".edit-qty").forEach(input => {
        const qty = Number(input.value);
        if (!Number.isInteger(qty) || qty <= 0) throw new Error("Every quantity must be a whole number greater than zero.");
        const id = Number(input.dataset.itemId);
        const estimated = document.querySelector(`.edit-estimated[data-item-id="${id}"]`).checked;
        lines.push({ item_id: id, qty, estimated });
      });
      const attendeeText = document.getElementById("edit-attendees").value.trim();
      const attendees = attendeeText === "" ? null : Number(attendeeText);
      if (attendees != null && (!Number.isInteger(attendees) || attendees < 0)) throw new Error("Attendees must be a whole number.");
      const projectName = document.getElementById("edit-project-name").value.trim();
      if (!projectName) throw new Error("Enter a project or event name.");
      const button = document.getElementById("edit-save");
      button.disabled = true;
      button.textContent = "Saving…";
      await api(`/orders/${order.id}`, {
        method: "PUT",
        body: JSON.stringify({
          notes: document.getElementById("edit-notes").value.trim(),
          project: {
            name: projectName,
            owner: document.getElementById("edit-owner").value.trim(),
            event_date: document.getElementById("edit-event").value,
            location: document.getElementById("edit-location").value.trim(),
            shipping_address1: document.getElementById("edit-address1").value.trim(),
            shipping_address2: document.getElementById("edit-address2").value.trim(),
            shipping_city: document.getElementById("edit-city").value.trim(),
            shipping_state: document.getElementById("edit-state").value,
            shipping_postal_code: document.getElementById("edit-zip").value.trim(),
            attendees,
          },
          lines,
        }),
      });
      closeModal();
      toast("Order #" + order.id + " updated.");
      await loadMyOrders();
    } catch (e) {
      error.textContent = e.message;
      const button = document.getElementById("edit-save");
      if (button) { button.disabled = false; button.textContent = "Save Changes"; }
    }
  };
}

    return item ? { item, qty, estimated: Boolean(state.estimated[id]) } : null;

      <button data-tab="catalog" class="${state.tab === "catalog" ? "active" : ""}">1. Catalog</button>
      <button data-tab="setup" class="${state.tab === "setup" ? "active" : ""}">2. Project & Delivery (${cartCount()})</button>
      <button data-tab="orders" class="${state.tab === "orders" ? "active" : ""}">My Orders</button>
    </nav>
    <main class="${state.tab === "setup" ? "setup-only" : ""}">
      <section class="view-panel">${state.tab === "catalog" ? renderCatalogTab() : state.tab === "setup" ? renderSlip() : renderOrdersTab()}</section>
      ${state.tab === "catalog" ? renderSlip() : ""}
    </main>
  `;
  wireApp(searchHadFocus, searchCursorPos);
}

// ---- event wiring ---------------------------------------------------------------
function wireLogin() {
  document.getElementById("login-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const button = e.target.querySelector('button[type="submit"]');
    button.disabled = true;
    button.innerHTML = '<span class="spinner" style="width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:7px"></span>Signing in';
    const fd = new FormData(e.target);
    doLogin(fd.get("username"), fd.get("password"));
  });
  document.getElementById("toggle-server").addEventListener("click", () => {
    state.showServerField = !state.showServerField;
    render();
  });
  const serverField = document.getElementById("f-server");
  if (serverField) {
    serverField.addEventListener("change", (e) => {
      state.apiBase = e.target.value.trim().replace(/\/$/, "") || DEFAULT_API_BASE;
    });
  }
}

function wireApp(searchHadFocus, searchCursorPos) {
  document.getElementById("logout-btn").addEventListener("click", () => logout());

  document.querySelectorAll("nav.tabs button").forEach(btn => {
    btn.addEventListener("click", () => {
      state.tab = btn.dataset.tab;
      renderWithTransition();
      if (state.tab === "orders") loadMyOrders();
    });
  });

  const openOrderSetup = document.getElementById("open-order-setup");
  if (openOrderSetup) openOrderSetup.addEventListener("click", () => {
    state.tab = "setup";
    renderWithTransition();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  const searchEl = document.getElementById("search");
  if (searchEl) {
    searchEl.addEventListener("input", (e) => { state.search = e.target.value; render(); });
    if (searchHadFocus) {
      searchEl.focus();
      searchEl.selectionStart = searchEl.selectionEnd =
        searchCursorPos ?? searchEl.value.length;
    }
  }
  const catEl = document.getElementById("category-filter");
  if (catEl) catEl.addEventListener("change", (e) => { state.category = e.target.value; render(); });
  const sortEl = document.getElementById("sort-by");
  if (sortEl) sortEl.addEventListener("change", (e) => { state.sort = e.target.value; render(); });

  document.querySelectorAll(".stepper button").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = Number(btn.dataset.id);
      const cur = state.cart[id] || 0;
      const max = Number(btn.dataset.max || 999999);
      setQty(id, btn.dataset.act === "inc" ? cur + 1 : cur - 1, max);
    });
  });

  document.querySelectorAll(".qty-input").forEach(input => {
    const commitWithoutRerender = () => {
      const id = Number(input.dataset.qtyId);
      const max = Number(input.dataset.max || 0);
      let requested = input.value === "" ? 0 : Number(input.value);
      if (!Number.isFinite(requested) || requested < 0) requested = 0;
      requested = Math.floor(requested);
      if (requested > max) {
        requested = max;
        toast("Only " + max + " are currently available.", true);
      }
      input.value = requested === 0 && input.value === "" ? "" : String(requested);
      if (requested === 0) {
        delete state.cart[id];
        delete state.estimated[id];
      } else {
        state.cart[id] = requested;
      }

      const stepper = input.closest(".stepper");
      if (stepper) {
        const dec = stepper.querySelector('[data-act="dec"]');
        const inc = stepper.querySelector('[data-act="inc"]');
        if (dec) dec.disabled = requested <= 0;
        if (inc) inc.disabled = requested >= max;
      }
      const estimate = document.querySelector(`.estimated-toggle[data-estimated-id="${id}"]`);
      if (estimate) {
        estimate.disabled = requested <= 0;
        if (requested <= 0) estimate.checked = false;
      }
      refreshCartPreview();
    };
    input.addEventListener("input", commitWithoutRerender);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        input.blur();
      }
    });
  });

  document.querySelectorAll(".estimated-toggle").forEach(toggle => {
    toggle.addEventListener("change", () => {
      const id = Number(toggle.dataset.estimatedId);
      if (!state.cart[id]) {
        toggle.checked = false;
        toggle.disabled = true;
        delete state.estimated[id];
      } else if (toggle.checked) {
        state.estimated[id] = true;
      } else {
        delete state.estimated[id];
      }
      refreshCartPreview();
    });
  });

  document.querySelectorAll(".request-count").forEach(btn => {
    btn.addEventListener("click", () => submitCountRequest(Number(btn.dataset.countId), btn.dataset.countName || "this item"));
  });

  document.querySelectorAll("[data-lightbox-src], [data-proof-id]").forEach(img => {
    img.addEventListener("click", () => {
      if (img.dataset.lightboxSrc) openLightbox(img.dataset.lightboxSrc, img.alt);
    });
  });
  loadProtectedProofImages();

  document.querySelectorAll(".edit-order").forEach(btn => {
    btn.addEventListener("click", () => openOrderEditor(Number(btn.dataset.orderId)));
  });

  wireRemoveButtons();

  const bindFormValue = (id, key, eventName = "input") => {
    const el = document.getElementById(id);
    if (el) el.addEventListener(eventName, (e) => { state.orderForm[key] = e.target.value; });
  };
  const projectChoice = document.getElementById("project-choice");
  if (projectChoice) {
    projectChoice.addEventListener("change", (e) => {
      state.orderForm.projectChoice = e.target.value;
      renderWithTransition();
    });
  }
  bindFormValue("project-name", "projectName");
  bindFormValue("project-owner", "projectOwner");
  const eventDate = document.getElementById("project-event-date");
  if (eventDate) eventDate.addEventListener("change", (e) => {
    state.orderForm.eventDate = e.target.value;
    render();
  });
  bindFormValue("project-location", "projectLocation");
  bindFormValue("shipping-address1", "shippingAddress1");
  bindFormValue("shipping-address2", "shippingAddress2");
  bindFormValue("shipping-city", "shippingCity");
  bindFormValue("shipping-postal-code", "shippingPostalCode");
  const shippingState = document.getElementById("shipping-state");
  if (shippingState) shippingState.addEventListener("change", (e) => {
    state.orderForm.shippingState = e.target.value;
    render();
  });
  bindFormValue("project-attendees", "attendees");
  bindFormValue("project-description", "projectDescription");
  bindFormValue("slip-notes", "notes");
  const saveProject = document.getElementById("save-project");
  if (saveProject) {
    saveProject.addEventListener("change", (e) => { state.orderForm.saveProject = e.target.checked; });
  }

  const submitBtn = document.getElementById("submit-order");
  if (submitBtn) submitBtn.addEventListener("click", submitOrder);
}

// ---- boot -------------------------------------------------------------------
(async function boot() {
  const lightbox = document.getElementById("lightbox");
  lightbox.querySelector(".lightbox-close").addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", (e) => { if (e.target === lightbox) closeLightbox(); });
  const modalRoot = document.getElementById("modal-root");
  modalRoot.addEventListener("click", (e) => { if (e.target === modalRoot) closeModal(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (lightbox.classList.contains("open")) closeLightbox();
      else if (modalRoot.classList.contains("open")) closeModal();
    }
  });
  if (state.token) {
    try {
      state.user = await api("/me");
      state.orderForm = blankOrderForm();
      await Promise.all([loadCatalog(), loadMyOrders()]);
      pollLoop();
    } catch (e) {
      // logout() already called by api() on 401; other errors just show login
    }
  }
  render();
})();
</script>
</body>
</html>
