<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#161A1F" />
  <title>Badge Studio · Otiwarehouse</title>
  <link rel="icon" type="image/png" href="/brand/logo-64.png" />
  <link rel="stylesheet" href="./badge-studio.css" />
  <link rel="stylesheet" href="./oti-badge.css" />
  <script src="./oti-badge.js"></script>
</head>
<body>
  <div class="oti-bar" id="oti-bar" hidden>
    <img class="oti-full-only" src="/brand/logo-64.png" alt="">
    <b class="oti-full-only">Badge Studio</b>
    <select id="oti-scope" class="oti-full-only" aria-label="Event"></select>
    <span id="oti-status" class="oti-status" role="status"></span>
    <span class="grow"></span>
    <button type="button" id="oti-backup" title="Download a .json backup (works with the portable version too)">Download backup</button>
    <button type="button" id="oti-restore" title="Replace this event's badges with a .json backup">Restore backup</button>
    <input id="oti-restore-file" type="file" accept=".json,application/json" hidden />
  </div>
  <!-- The bundle expects these elements; Otiwarehouse uses its own bar above. -->
  <div id="offline-bar" hidden>
    <span id="portable-status"></span>
    <button id="backup-project" type="button" hidden></button>
    <button id="restore-project" type="button" hidden></button>
    <input id="restore-file" type="file" hidden />
  </div>
  <div id="root"></div>
  <script src="./badge-studio.js"></script>
</body>
</html>
