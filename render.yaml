services:
  - type: web
    name: oti-warehouse-swag
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "pip install -r requirements.txt && python scripts/init_db.py"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oti-warehouse-swag-db
          property: connectionString

databases:
  - name: oti-warehouse-swag-db
    databaseName: oti_warehouse_swag
    plan: free
    region: oregon

# Item photos are stored in the database by the current build, so they survive
# web-service restarts even when local filesystem storage is temporary.
# ASSETS_DIR remains an optional local cache/backward-compatibility location.
